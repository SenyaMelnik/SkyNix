    );

    document.getElementById(
        "moderationUser"
    ).innerHTML =
        `
        <option value="">
            Нет
        </option>
        `;

    document.getElementById(
        "telegramUser"
    ).innerHTML =
        `
        <option value="">
            Нет
        </option>
        `;

    document.getElementById(
        "muteAmount"
    ).value = "";

    document.getElementById(
        "muteReason"
    ).value = "";

    document.getElementById(
        "actionReason"
    ).value = "";

    moderationUsers = [];

    telegramUsers = [];

    hideModerationError();

}


// ======================================================
// LOAD DISCORD USERS
// ======================================================

async function loadModerationUsers() {

    const select =
        document.getElementById(
            "moderationUser"
        );

    select.disabled =
        true;

    select.innerHTML =
        `
        <option value="">
            Загрузка пользователей...
        </option>
        `;

    try {

        if (!discordSession) {

            throw new Error(
                "Discord не авторизован."
            );

        }

        const encodedSession =
            encodeBase64UTF8(
                JSON.stringify(
                    discordSession
                )
            );

        let type =
            "members";

        if (
            moderationAction === "unmute"
        ) {

            type =
                "muted";

        }

        if (
            moderationAction === "unban"
        ) {

            type =
                "banned";

        }

        const response =
            await fetch(
                `${WORKER_URL}/api/discord/moderation/users?type=${type}`,
                {
                    method: "GET",

                    headers: {
                        "Authorization":
                            `Bearer ${encodedSession}`
                    }
                }
            );

        const data =
            await response.json();

        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.error ||
                "Не удалось получить список пользователей."
            );

        }

        moderationUsers =
            Array.isArray(
                data.users
            )
                ? data.users
                : [];

        select.innerHTML =
            "";

        const noneOption =
            document.createElement(
                "option"
            );

        noneOption.value =
            "";

        noneOption.textContent =
            "Нет";

        select.appendChild(
            noneOption
        );

        moderationUsers
            .sort(
                (a, b) =>
                    (
                        a.displayName ||
                        a.username ||
                        ""
                    ).localeCompare(
                        b.displayName ||
                        b.username ||
                        "",
                        "ru"
                    )
            )
            .forEach(
                user => {

                    const option =
                        document.createElement(
                            "option"
                        );

                    option.value =
                        String(
                            user.id
                        );

                    option.textContent =
                        user.displayName
                            ? (
                                user.username
                                    ? `${user.displayName} (@${user.username})`
                                    : user.displayName
                              )
                            : (
                                user.username
                                    ? `@${user.username}`
                                    : String(user.id)
                              );

                    select.appendChild(
                        option
                    );

                }
            );

    }

    catch (error) {

        console.error(
            "Ошибка списка Discord:",
            error
        );

        select.innerHTML =
            `
            <option value="">
                Нет
            </option>
            `;

        showModerationError(
            error.message ||
            "Не удалось получить пользователей Discord."
        );

    }

    finally {

        select.disabled =
            false;

    }

}


// ======================================================
// LOAD TELEGRAM USERS
// ======================================================

async function loadTelegramUsers() {

    const select =
        document.getElementById(
            "telegramUser"
        );

    if (!select) {

        console.error(
            "Telegram: элемент telegramUser не найден."
        );

        return;

    }

    select.disabled =
        true;

    select.innerHTML =
        `
        <option value="">
            Загрузка пользователей...
        </option>
        `;

    telegramUsers = [];

    try {

        /*
         * ВАЖНО:
         *
         * Используем ipcRenderer напрямую.
         *
         * window.electronAPI у тебя НЕ существует,
         * поэтому старый вызов давал ошибку.
         */

        const members =
            await ipcRenderer.invoke(
                (moderationAction === "unban" ? "telegram-get-banned" : "telegram-get-members")
            );

        console.log(
            "Telegram /api/members:",
            members
        );

        if (!Array.isArray(members)) {

            throw new Error(
                "Telegram: Worker вернул некорректный список пользователей."
            );

        }

        telegramUsers =
            members.filter(
                user =>
                    user &&
                    user.id !== null &&
                    user.id !== undefined
            );

        select.innerHTML =
            "";

        const noneOption =
            document.createElement(
                "option"
            );

        noneOption.value =
            "";

        noneOption.textContent =
            "Нет";

        select.appendChild(
            noneOption
        );

        for (
            const user of telegramUsers
        ) {

            const option =
                document.createElement(
                    "option"
                );

            /*
             * Здесь должен быть НАСТОЯЩИЙ
             * Telegram numeric ID.
             */

            option.value =
                String(
                    user.id
                );

            let displayName = "";

            if (user.username) {

                displayName =
                    "@" +
                    String(
                        user.username
                    );

            }
            else {

                displayName =
                    [
                        user.first_name,
                        user.last_name
                    ]
                        .filter(Boolean)
                        .join(" ");

            }

            if (!displayName) {

                displayName =
                    String(
                        user.id
                    );

            }

            option.textContent =
                displayName +
                (
                    window.telegramGroupSuffix
                        ? window.telegramGroupSuffix(user, moderationAction === "unban")
                        : ""
                );

            select.appendChild(
                option
            );

        }

        /*
         * Даже если список пустой,
         * это не ошибка.
         */

        // Ручной ввод для разбана: @username или числовой ID
        const oldManual = document.getElementById("telegramManual");

        if (oldManual) oldManual.remove();

        if (moderationAction === "unban") {

            const manual = document.createElement("input");

            manual.id = "telegramManual";
            manual.type = "text";
            manual.placeholder = "Нет в списке? Введите @username или ID";
            manual.style.marginTop = "8px";

            select.parentNode.insertBefore(manual, select.nextSibling);

        }

        console.log(
            "Telegram пользователи загружены:",
            telegramUsers.length
        );

    }

    catch (error) {

        console.error(
            "Ошибка загрузки Telegram пользователей:",
            error
        );

        telegramUsers = [];

        select.innerHTML =
            `
            <option value="">
                Нет
            </option>
            `;

        showModerationError(
            "Telegram: " +
            (
                error?.message ||
                "не удалось загрузить пользователей."
            )
        );

    }

    finally {

        select.disabled =
            false;

    }

}


// ======================================================
// MUTE DURATION
// ======================================================

function getMuteDuration() {

    const amountInput =
        document.getElementById(
            "muteAmount"
        );

    const unitInput =
        document.getElementById(
            "muteUnit"
        );

    if (!amountInput) {

        throw new Error(
            "Поле времени мута не найдено."
        );

    }

    const amount =
        Number(
            amountInput.value
        );

    if (
        !Number.isFinite(amount) ||
        amount <= 0
    ) {

        throw new Error(
            "Укажите конкретное время мута."
        );

    }

    const rawUnit =
        unitInput
            ? String(
                unitInput.value || ""
              )
                .trim()
                .toLowerCase()
            : "";

    const multipliers = {

        s:
            1000,

        m:
            60 *
            1000,

        h:
            60 *
            60 *
            1000,

        d:
            24 *
            60 *
            60 *
            1000

    };

    const multiplier =
        multipliers[
            rawUnit
        ];

    if (!multiplier) {

        throw new Error(
            "Неизвестная единица времени: " +
            rawUnit
        );

    }

    const duration =
        amount *
        multiplier;

    const maxDuration =
        28 *
        24 *
        60 *
        60 *
        1000;

    if (
        duration >
        maxDuration
    ) {

        throw new Error(
            "Максимальное время мута — 28 дней."
        );

    }

    return duration;

}


// ======================================================
// GET DISPLAY NAME
// ======================================================

function getDiscordDisplayName(id) {

    const user =
        moderationUsers.find(
            item =>
                String(item.id) ===
                String(id)
        );

    if (!user) {

        return "пользователя Discord";

    }

    return (
        user.displayName ||
        user.username ||
        "пользователя Discord"
    );

}


function getTelegramDisplayName(id) {

    const user =
        telegramUsers.find(
            item =>
                String(item.id) ===
                String(id)
        );

    if (!user) {

        return "пользователя Telegram";

    }

    if (user.username) {

        return (
            "@" +
            String(
                user.username
            )
        );

    }

    const fullName =
        [
            user.first_name,
            user.last_name
        ]
            .filter(Boolean)
            .join(" ");

    return (
        fullName ||
        "пользователя Telegram"
    );

}


// ======================================================
// CONFIRM MODERATION
// ======================================================

async function confirmModeration() {

    hideModerationError();

    try {

        const discordSelect =
            document.getElementById(
                "moderationUser"
            );

        const telegramSelect =
            document.getElementById(
                "telegramUser"
            );

        const discordId =
            discordSelect &&
            discordSelect.value &&
            discordSelect.value !== "Нет"
                ? String(
                    discordSelect.value
                  ).trim()
                : "";

        let telegramId =
            telegramSelect &&
            telegramSelect.value &&
            telegramSelect.value !== "Нет"
                ? String(telegramSelect.value).trim()
                : "";

        const manualInput = document.getElementById("telegramManual");

        if (!telegramId && manualInput && manualInput.value.trim()) {

            const typed = manualInput.value.trim();

            if (/^\d+$/.test(typed)) {

                telegramId = typed;

            }
            else {

                try {

                    telegramId = String(
                        await ipcRenderer.invoke("telegram-resolve", typed)
                    );

                }
                catch (error) {

                    throw new Error(
                        "Telegram: " +
                        String((error && error.message) || error)
                            .replace(/^Error invoking remote method '[^']*':\s*(Error:\s*)?/, "")
                    );

                }

            }

        }

        if (
            !discordId &&
            !telegramId
        ) {
            throw new Error(
                "Выберите пользователя Discord или Telegram."
            );
        }


        // ==============================================
        // ПРИЧИНА
        // ==============================================

        let reason = "";

        if (
            moderationAction ===
            "mute"
        ) {

            const input =
                document.getElementById(
                    "muteReason"
                );

            reason =
                input
                    ? String(
                        input.value || ""
                      ).trim()
                    : "";

        } else {

            const input =
                document.getElementById(
                    "actionReason"
                );

            reason =
                input
                    ? String(
                        input.value || ""
                      ).trim()
                    : "";

        }


        if (!reason) {

            throw new Error(
                "Укажите причину."
            );

        }


        // ==============================================
        // ВРЕМЯ МУТА
        // ==============================================

        let duration = null;

        if (
            moderationAction ===
            "mute"
        ) {

            duration =
                getMuteDuration();

            console.log(
                "Время мута:",
                duration,
                "мс"
            );

        }


        // ==============================================
        // ПОЛНЫЕ ДАННЫЕ
        // ==============================================

        const actionData = {

            action:
                moderationAction,

            discordUserId:
                discordId || null,

            telegramUserId:
                telegramId || null,

            duration:
                duration,

            reason:
                reason

        };


        console.log(
            "Модерация:",
            actionData
        );


        const confirmButton =
            document.getElementById(
                "moderationConfirm"
            );

        confirmButton.disabled =
            true;

        confirmButton.textContent =
            "Выполнение...";


        await sendModerationAction(
            actionData
        );


        window.alert(
            "Действие успешно выполнено."
        );


        closeModerationModal();

    }

    catch (error) {

        console.error(
            "Ошибка модерации:",
            error
        );

        showModerationError(
            error?.message ||
            String(error)
        );

    }

    finally {

        const button =
            document.getElementById(
                "moderationConfirm"
            );

        if (button) {

            button.disabled =
                false;

            updateModerationModal();

        }

    }

}


// ======================================================
// SEND MODERATION ACTION
// ======================================================

async function sendModerationAction(
    actionData
) {

    if (!actionData) {

        throw new Error(
            "Данные модерации отсутствуют."
        );

    }


    const action =
        String(
            actionData.action || ""
        ).trim();


    const discordUserId =
        actionData.discordUserId
            ? String(
                actionData.discordUserId
              ).trim()
            : "";


    const telegramUserId =
        actionData.telegramUserId
            ? String(
                actionData.telegramUserId
              ).trim()
            : "";


    const duration =
        actionData.duration;


    const reason =
        actionData.reason || "";


    if (
        !discordUserId &&
        !telegramUserId
    ) {

        throw new Error(
            "Не выбран пользователь."
        );

    }


    // ==================================================
    // DISCORD
    // ==================================================

    if (discordUserId) {

        try {

            await ipcRenderer.invoke(
                "discord-moderation",
                {
                    action:
                        action,

                    userId:
                        discordUserId,

                    duration:
                        duration,

                    reason:
                        reason
                }
            );

        }

        catch (error) {

            throw new Error(
                "Discord: " +
                (
                    error?.message ||
                    String(error)
                )
            );

        }

    }


    // ==================================================
    // TELEGRAM
    // ==================================================

    if (telegramUserId) {

        const numericTelegramId =
            Number(
                telegramUserId
            );


        if (
            !Number.isFinite(
                numericTelegramId
            )
        ) {

            throw new Error(
                "Некорректный Telegram ID."
            );

        }


        const payload = {

            action:
                action,

            telegram_user_id:
                numericTelegramId,

            reason:
                reason,

            moderator:
                discordSession?.username ||
                discordSession?.globalName ||
                "SkyNix"

        };


        // ==============================================
        // TELEGRAM MUTE
        // ==============================================

        if (
            action ===
            "mute"
        ) {

            const durationMs =
                Number(
                    duration
                );


            console.log(
                "Telegram duration:",
                durationMs
            );


            if (
                !Number.isFinite(
                    durationMs
                ) ||
                durationMs <= 0
            ) {

                throw new Error(
                    "Некорректное время мута."
                );

            }


            const maxDuration =
                28 *
                24 *
                60 *
                60 *
                1000;


            if (
                durationMs >
                maxDuration
            ) {

                throw new Error(
                    "Максимальное время мута — 28 дней."
                );

            }


            payload.duration_ms =
                durationMs;

        }


        console.log(
            "Telegram moderation:",
            payload
        );


        try {

            await ipcRenderer.invoke(
                "telegram-moderation",
                payload
            );

        }

        catch (error) {

            throw new Error(
                "Telegram: " +
                (
                    error?.message ||
                    String(error)
                )
            );

        }

    }


    return {
        ok: true
    };

}


// ======================================================
// MODAL ERROR
// ======================================================

function showModerationError(
    message
) {

    const error =
        document.getElementById(
            "moderationError"
        );

    error.textContent =
        message;

    error.classList.add(
        "visible"
    );

}


function hideModerationError() {

    const error =
        document.getElementById(
            "moderationError"
        );

    error.textContent =
        "";

    error.classList.remove(
        "visible"
    );

}


// ======================================================
// CLOSE MODAL ON BACKGROUND CLICK
// ======================================================

document.getElementById(
    "moderationOverlay"
).addEventListener(
    "click",
    event => {

        if (
            event.target ===
            event.currentTarget
        ) {

            closeModerationModal();

        }

    }
);


// ======================================================
// START
// ======================================================

loadDiscordSession();


// ======================================================
// CHECK ROLE EVERY 10 SECONDS
// ======================================================

setInterval(
    refreshDiscordRole,
    10000
);

</script>
