<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<title>SkyNix</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {

    margin: 0;

    background:
        radial-gradient(
            circle at top,
            #171535 0%,
            #0b0b16 55%
        );

    color: white;

    font-family: Arial, sans-serif;

    user-select: none;

    overflow: hidden;
}

input,
textarea,
select {

    user-select: text;

    -webkit-user-select: text;

    pointer-events: auto;
}

input {
    cursor: text;
}

input[type="number"] {

    user-select: text;

    -webkit-user-select: text;

    cursor: text;
}

.modal input {

    user-select: text;

    -webkit-user-select: text;

    pointer-events: auto;
}

.modal input:focus {

}

.container {

    width: 100%;

}

.logo {

    font-weight: 700;

    background:

            #5b8cff,

    margin-bottom: 8px;
}

.subtitle {

    color: #85859c;

    margin-bottom: 22px;
}

.actions {

    width: 100%;
}

button {

    width: 100%;

    height: 52px;

    margin: 6px 0;

    border-radius: 12px;

    border:
        1px solid #363653;

    background:
        #1d1d34;

    color: white;

    font-size: 15px;

    font-weight: 600;

    cursor: pointer;

    transition:
        background .15s,
        transform .15s;
}

button:hover {

    background:
        #292949;

    transform:
        translateY(-1px);
}

button:active {

    transform:
        translateY(0);
}

button:disabled {

    opacity: .5;

    cursor: default;

    transform: none;
}

<script>

const {
    shell,
    ipcRenderer
} = (
    typeof require === "function"
        ? require("electron")
        : window.SkyNixMobile
);


// ======================================================
// НЕБЛОКИРУЮЩИЕ СООБЩЕНИЯ ВМЕСТО window.alert
// ------------------------------------------------------
// Системный alert в Electron (Windows) после закрытия
// «ломает» фокус окна: в полях ввода нельзя печатать,
// списки не выбираются, пока окно не свернуть/развернуть.
// Поэтому показываем сообщение внутри приложения.
// ======================================================

(function () {

    let container = null;

    function getContainer() {

        if (container && container.isConnected) {
            return container;
        }

        container =
            document.createElement("div");

        container.style.cssText =
            "position:fixed;left:0;right:0;bottom:24px;" +
            "display:flex;flex-direction:column;" +
            "align-items:center;gap:8px;" +
            "z-index:2147483647;pointer-events:none;";

        document.body.appendChild(container);

        return container;

    }

    window.alert = function (message) {

        try {

            const toast =
                document.createElement("div");

            toast.textContent =
                String(message ?? "");

            toast.style.cssText =
                "max-width:80%;padding:12px 18px;" +
                "border-radius:12px;font-size:14px;" +
                "line-height:1.4;color:#fff;" +
                "background:#1b1740;" +
                "border:1px solid #7c5cff;" +
                "box-shadow:0 8px 24px rgba(0,0,0,.45);" +
                "opacity:0;transition:opacity .2s;" +
                "pointer-events:auto;";

            getContainer().appendChild(toast);

            requestAnimationFrame(
                () => {
                    toast.style.opacity = "1";
                }
            );

            const hide = () => {

                toast.style.opacity = "0";

                setTimeout(
                    () => toast.remove(),
                    250
                );

            };

            toast.onclick = hide;

            setTimeout(
                hide,
                Math.min(
                    12000,
                    3500 + toast.textContent.length * 40
                )
            );

        }

        catch (error) {

            console.error(
                "Toast:",
                error
            );

        }

    };

})();


// ======================================================
// СООБЩЕНИЯ О МУТЕ / БАНЕ (приходят от модераторов)
// ======================================================

(function () {

    const queue = [];
    const seen = new Set();

    let overlay = null;
    let current = null;

    function el(tag, css, text) {

        const node =
            document.createElement(tag);

        if (css) node.style.cssText = css;

        if (text !== undefined) {
            node.textContent = text;
        }

        return node;

    }

    function close() {

        if (current) {

            ipcRenderer
                .invoke(
                    "moderation-notice-ack",
                    [current.id]
                )
                .catch(() => {});

        }

        current = null;

        if (overlay) {
            overlay.remove();
            overlay = null;
        }

        showNext();

    }

    function showNext() {

        if (current || !queue.length) return;

        current = queue.shift();

        const view = current.view || {};

        overlay = el(
            "div",
            "position:fixed;inset:0;" +
            "background:rgba(0,0,0,.7);" +
            "display:flex;align-items:center;" +
            "justify-content:center;" +
            "z-index:2147483646;padding:16px;"
        );

        const card = el(
            "div",
            "width:100%;max-width:420px;" +
            "background:#12102b;color:#fff;" +
            "border:1px solid #7c5cff;" +
            "border-radius:16px;padding:22px;" +
            "box-shadow:0 12px 40px rgba(0,0,0,.6);"
        );

        card.appendChild(
            el(
                "div",
                "font-size:20px;font-weight:700;" +
                "margin-bottom:14px;",
                view.title || "Модерация"
            )
        );

        for (const row of (view.rows || [])) {

            const line = el(
                "div",
                "margin:8px 0;font-size:15px;" +
                "line-height:1.4;word-break:break-word;"
            );

            line.appendChild(
                el(
                    "span",
                    "color:#a9a3d6;",
                    String(row[0]) + ": "
                )
            );

            line.appendChild(
                el(
                    "span",
                    "font-weight:600;",
                    String(row[1])
                )
            );

            card.appendChild(line);

        }

        const button = el(
            "button",
            "margin-top:16px;width:100%;" +
            "padding:12px;border:none;" +
            "border-radius:12px;cursor:pointer;" +
            "font-size:15px;font-weight:600;" +
            "color:#fff;background:#6d4aff;",
            "Понятно"
        );

        button.onclick = close;

        card.appendChild(button);

        overlay.appendChild(card);

        document.body.appendChild(overlay);

    }

    ipcRenderer.on(
        "moderation-notice",
        (event, payload) => {

            if (
                !payload ||
                !payload.id ||
                seen.has(payload.id)
            ) {
                return;
            }

            seen.add(payload.id);

            queue.push(payload);

            showNext();

        }
    );

})();


// ======================================================
// URL
// ======================================================

const WORKER_URL =
    "https://discord.skynix.workers.dev";

const WIKI_URL =
    "https://wiki.skynix.workers.dev";

const YOUTUBE_URL =
    "https://www.youtube.com/@SenyaMelnik_Games";

const APPLICATION_URL =
    "https://forms.gle/gtYFhD5UeHycSRAb8";

const APPLICATION_BOT_URL =
    "https://t.me/Applications_SkyNix_BOT";


// ======================================================
// ROLES
// ======================================================

const ROLE_RECRUIT =
    "Новобранец SkyNix";

const ROLE_MEMBER =
    "Участник SkyNix";

const ROLE_IS_MOD =
    "И.С.Модератор";

const ROLE_ML_MOD =
    "Мл.Модератор";

const ROLE_MOD =
    "Модератор";

const ROLE_GL_MOD =
    "Гл.Модератор";

const ROLE_DEPUTY =
    "Заместитель";

const ROLE_RIGHT_HAND =
    "Правая рука Создателя";

const ROLE_ARCHON =
    "Архонт";


// ======================================================
// SESSION
// ======================================================

let discordSession = null;


// ======================================================
// MODERATION
// ======================================================

let moderationAction = null;

let moderationUsers = [];

let telegramUsers = [];


// ======================================================
// OPEN EXTERNAL
// ======================================================

function openExternal(url) {

    shell.openExternal(url);

}


// Wiki открывается в отдельном окне внутри приложения.
// Если по какой-то причине не получилось — откроем в браузере.
async function openWiki() {

    try {

        await ipcRenderer.invoke(
            "open-wiki"
        );

    }

    catch (error) {

        console.error(
            "Wiki:",
            error
        );

        openExternal(WIKI_URL);

    }

}


// ======================================================
// UTF-8 -> BASE64
// ======================================================

function encodeBase64UTF8(text) {

    const bytes =
        new TextEncoder().encode(text);

    let binary = "";

    const chunkSize = 0x8000;

    for (
        let i = 0;
        i < bytes.length;
        i += chunkSize
    ) {

        const chunk =
            bytes.subarray(
                i,
                Math.min(
                    i + chunkSize,
                    bytes.length
                )
            );

        binary +=
            String.fromCharCode(
                ...chunk
            );

    }

    return btoa(binary);

}


// ======================================================
// BASE64 -> SESSION
// ======================================================

function decodeBase64UTF8(encoded) {

    const binary =
        atob(encoded);

    const bytes =
        Uint8Array.from(
            binary,
            char =>
                char.charCodeAt(0)
        );

    const decoded =
        new TextDecoder("utf-8").decode(bytes);

    return JSON.parse(decoded);

}


// ======================================================
// LOAD SESSION
// ======================================================

function loadDiscordSession() {

    try {

        const saved =
            localStorage.getItem(
                "skynix_discord_session"
            );

        if (!saved) {

            discordSession = null;

            renderInterface();

            showNotConnected();

            return;

        }

        discordSession =
            JSON.parse(saved);

        renderInterface();

        showDiscordStatus(
            discordSession
        );

        refreshDiscordRole();

    }

    catch (error) {

        console.error(
            "Discord: ошибка загрузки сессии:",
            error
        );

        discordSession = null;

        localStorage.removeItem(
            "skynix_discord_session"
        );

        renderInterface();

        showNotConnected();

    }

}


// ======================================================
// LOGIN
// ======================================================

async function loginDiscord() {

    try {

        await ipcRenderer.invoke(
            "discord-login"
        );

    }

    catch (error) {

        console.error(
            "Discord: ошибка входа:",
            error
        );

        window.alert(
            error.message ||
            "Не удалось открыть авторизацию Discord."
        );

    }

}


// ======================================================
// DISCORD SESSION FROM MAIN
// ======================================================

ipcRenderer.on(
    "discord-session",
    (
        event,
        encodedSession
    ) => {

        try {

            const session =
                decodeBase64UTF8(
                    encodedSession
                );

            discordSession =
                session;

            localStorage.setItem(
                "skynix_discord_session",
                JSON.stringify(session)
            );

            showDiscordStatus(
                session
            );

            renderInterface();

            refreshDiscordRole();

        }

        catch (error) {

            console.error(
                "Discord: ошибка callback:",
                error
            );

        }

    }
);


// ======================================================
// DISCORD LOGOUT FROM MAIN
// ======================================================

ipcRenderer.on(
    "discord-logout",
    () => {

        discordSession =
            null;

        localStorage.removeItem(
            "skynix_discord_session"
        );

        showNotConnected();

        renderInterface();

    }
);


// ======================================================
// REFRESH ROLE
// ======================================================

async function refreshDiscordRole() {

    if (!discordSession) {
        return;
    }

    try {

        const encodedSession =
            encodeBase64UTF8(
                JSON.stringify(
                    discordSession
                )
            );

        const response =
            await fetch(
                `${WORKER_URL}/api/discord/me`,
                {
                    method: "GET",

                    headers: {
                        "Authorization":
                            `Bearer ${encodedSession}`
                    }
                }
            );

        if (!response.ok) {
            return;
        }

        const data =
            await response.json();

        if (
            !data.success ||
            !data.session
        ) {
            return;
        }

        discordSession =
            data.session;

        localStorage.setItem(
            "skynix_discord_session",
            JSON.stringify(
                discordSession
            )
        );

        showDiscordStatus(
            discordSession
        );

        renderInterface();

    }

    catch (error) {

        console.error(
            "Discord: ошибка обновления:",
            error
        );

    }

}


// ======================================================
// DISCORD STATUS
// ======================================================

function showDiscordStatus(session) {

    const status =
        document.getElementById(
            "discordStatus"
        );

    const text =
        document.getElementById(
            "discordText"
        );

    const login =
        document.getElementById(
            "discordLogin"
        );

    status.className =
        "discord-status";

    if (
        session.status ===
        "not_member"
    ) {

        status.classList.add(
            "discord-red"
        );

        text.textContent =
            "Не участник SkyNix";

        login.style.display =
            "none";

        return;

    }

    if (
        session.status ===
        "recruit"
    ) {

        status.classList.add(
            "discord-orange"
        );

        text.textContent =
            "🔰 Новобранец SkyNix";

        login.style.display =
            "none";

        return;

    }

    status.classList.add(
        "discord-green"
    );

    if (
        session.role &&
        session.role !== ROLE_MEMBER
    ) {

        text.textContent =
            `✅ Участник SkyNix (${session.role})`;

    }

    else {

        text.textContent =
            "✅ Участник SkyNix";

    }

    login.style.display =
        "none";

}


// ======================================================
// NOT CONNECTED
// ======================================================

function showNotConnected() {

    const status =
        document.getElementById(
            "discordStatus"
        );

    const text =
        document.getElementById(
            "discordText"
        );

    const login =
        document.getElementById(
            "discordLogin"
        );

    status.className =
        "discord-status discord-gray";

    text.textContent =
        "Discord не привязан";

    login.style.display =
        "block";

    document.getElementById(
        "discordMenu"
    ).style.display =
        "none";

}


// ======================================================
// DISCORD MENU
// ======================================================

function toggleDiscordMenu() {

    if (!discordSession) {
        return;
    }

    const menu =
        document.getElementById(
            "discordMenu"
        );

    const name =
        document.getElementById(
            "discordMenuName"
        );

    const role =
        document.getElementById(
            "discordMenuRole"
        );

    name.textContent =
        discordSession.globalName ||
        discordSession.username ||
        "Discord";

    role.textContent =
        discordSession.role ||
        "Аккаунт привязан";

    menu.style.display =
        menu.style.display === "block"
            ? "none"
            : "block";

}


// ======================================================
// ПРОФИЛЬ
// ======================================================

(function () {

    let overlay = null;
    let pollTimer = null;

    function el(tag, css, text) {

        const node =
            document.createElement(tag);

        if (css) node.style.cssText = css;

        if (text !== undefined) {
            node.textContent = text;
        }

        return node;

    }

    function cleanError(error) {

        const message =
            String(
                (error && error.message) ||
                error ||
                ""
            );

        return (
            message.replace(
                /^Error invoking remote method '[^']*':\s*(Error:\s*)?/,
                ""
            ) ||
            "Не удалось выполнить запрос."
        );

    }

    function two(value) {
        return String(value).padStart(2, "0");
    }

    function formatDate(timestamp) {

        const date =
            new Date(Number(timestamp));

        return (
            two(date.getDate()) +
            "." +
            two(date.getMonth() + 1) +
            " " +
            date.getHours() +
            ":" +
            two(date.getMinutes())
        );

    }

    function formatDateTime(timestamp) {

        const date =
            new Date(Number(timestamp));

        return (
            formatDate(timestamp) +
            " (" +
            date.getFullYear() +
            ")"
        );

    }

    function pluralRu(n, forms) {

        const n10 = n % 10;
        const n100 = n % 100;

        if (n10 === 1 && n100 !== 11) {
            return forms[0];
        }

        if (
            n10 >= 2 &&
            n10 <= 4 &&
            (n100 < 12 || n100 > 14)
        ) {
            return forms[1];
        }

        return forms[2];

    }

    function formatDuration(raw) {

        const match =
            String(raw || "").match(
                /^(\d+)(s|m|h|d)$/i
            );

        if (!match) return null;

        const value = Number(match[1]);

        const words = {
            s: ["секунда", "секунды", "секунд"],
            m: ["минута", "минуты", "минут"],
            h: ["час", "часа", "часов"],
            d: ["день", "дня", "дней"]
        };

        return (
            value +
            " " +
            pluralRu(
                value,
                words[match[2].toLowerCase()]
            )
        );

    }

    function stopPolling() {

        if (pollTimer) {
            clearInterval(pollTimer);
            pollTimer = null;
        }

    }

    function closeProfile() {

        stopPolling();

        if (overlay) {
            overlay.remove();
            overlay = null;
        }

    }

    function section(title) {

        const box = el(
            "div",
            "margin-top:18px;padding-top:14px;" +
            "border-top:1px solid #2c2a55;"
        );

        box.appendChild(
            el(
                "div",
                "font-size:16px;font-weight:700;" +
                "margin-bottom:10px;",
                title
            )
        );

        return box;

    }

    function muted(text) {

        return el(
            "div",
            "color:#a9a3d6;font-size:14px;" +
            "line-height:1.4;",
            text
        );

    }

    function smallButton(text, onClick) {

        const button = el(
            "button",
            "margin:8px 8px 0 0;padding:9px 14px;" +
            "border:none;border-radius:10px;" +
            "cursor:pointer;font-size:14px;" +
            "font-weight:600;color:#fff;" +
            "background:#6d4aff;width:auto;height:auto;",
            text
        );

        button.onclick = onClick;

        return button;

    }

    // ---------------- ШАПКА ----------------

    function renderHeader(profile) {

        const header = el(
            "div",
            "display:flex;align-items:center;gap:14px;"
        );

        const letter =
            String(profile.name || "?")
                .trim()
                .charAt(0)
                .toUpperCase() || "?";

        function fallbackAvatar() {

            return el(
                "div",
                "width:64px;height:64px;" +
                "border-radius:50%;flex:none;" +
                "background:#2c2a55;display:flex;" +
                "align-items:center;" +
                "justify-content:center;" +
                "font-size:26px;font-weight:700;",
                letter
            );

        }

        if (profile.avatar) {

            const img =
                document.createElement("img");

            img.src =
                "https://cdn.discordapp.com/avatars/" +
                profile.id +
                "/" +
                profile.avatar +
                ".png?size=128";

            img.style.cssText =
                "width:64px;height:64px;" +
                "border-radius:50%;flex:none;";

            img.onerror = () => {
                img.replaceWith(fallbackAvatar());
            };

            header.appendChild(img);

        }
        else {

            header.appendChild(fallbackAvatar());

        }

        const info = el("div", "min-width:0;");

        info.appendChild(
            el(
                "div",
                "font-size:20px;font-weight:700;" +
                "word-break:break-word;",
                profile.name || "Пользователь"
            )
        );

        info.appendChild(
            el(
                "div",
                "margin-top:4px;color:#a9a3d6;" +
                "font-size:14px;",
                profile.status === "not_member"
                    ? "Не в команде"
                    : (profile.role || "Участник")
            )
        );

        header.appendChild(info);

        return header;

    }

    // ---------------- ИСТОРИЯ ----------------

    const HISTORY_TEXT = {
        mute: ["вы были замучены", "вас замутил"],
        unmute: ["вы были размучены", "вас размутил"],
        ban: ["вы были забанены", "вас забанил"],
        unban: ["вы были разбанены", "вас разбанил"]
    };

    function renderHistory(profile) {

        const box = section("История наказаний");

        const history =
            Array.isArray(profile.history)
                ? profile.history
                : [];

        if (!history.length) {

            box.appendChild(
                muted("Наказаний пока нет.")
            );

            return box;

        }

        for (const item of history) {

            const texts =
                HISTORY_TEXT[item.action] ||
                [String(item.action || ""), "от"];

            const entry = el(
                "div",
                "margin:0 0 14px 0;font-size:14px;" +
                "line-height:1.45;"
            );

            entry.appendChild(
                el(
                    "div",
                    "color:#a9a3d6;font-size:13px;",
                    formatDate(item.createdAt)
                )
            );

            entry.appendChild(
                el("div", "", texts[0])
            );

            entry.appendChild(
                el(
                    "div",
                    "",
                    texts[1] + " " +
                    (item.moderator || "Модератор")
                )
            );

            if (item.action === "mute") {

                const duration =
                    formatDuration(item.duration);

                if (duration) {

                    entry.appendChild(
                        el(
                            "div",
                            "",
                            "на срок " + duration
                        )
                    );

                }

            }

            entry.appendChild(
                el(
                    "div",
                    "word-break:break-word;",
                    item.reason
                        ? "по причине " + item.reason
                        : "причина не указана"
                )
            );

            box.appendChild(entry);

        }

        return box;

    }

    // ---------------- TELEGRAM ----------------

    function renderTelegram(container) {

        const box = section("Telegram");

        container.appendChild(box);

        const body = el("div", "");

        box.appendChild(body);

        function showLoading() {

            body.textContent = "";

            body.appendChild(muted("Загрузка..."));

        }

        function showError(error) {

            body.textContent = "";

            body.appendChild(
                el(
                    "div",
                    "color:#ff8a8a;font-size:14px;",
                    cleanError(error)
                )
            );

            body.appendChild(
                smallButton(
                    "Повторить",
                    refresh
                )
            );

        }

        function showLinked(data) {

            stopPolling();

            body.textContent = "";

            const telegram =
                data.telegram || {};

            body.appendChild(
                el(
                    "div",
                    "font-size:14px;margin-bottom:12px;",
                    "Привязан: " +
                    (
                        telegram.username
                            ? "@" + telegram.username
                            : (telegram.name || "аккаунт Telegram")
                    )
                )
            );

            const warnings = data.warnings;

            if (!warnings) {

                body.appendChild(
                    muted(
                        "Данные о предупреждениях пока не загружены."
                    )
                );

            }
            else if (
                !warnings.items ||
                !warnings.items.length
            ) {

                body.appendChild(
                    muted(
                        "Вас нет в списках предупреждений."
                    )
                );

            }
            else {

                for (const item of warnings.items) {

                    const line = el(
                        "div",
                        "display:flex;" +
                        "justify-content:space-between;" +
                        "gap:12px;margin:6px 0;" +
                        "font-size:14px;"
                    );

                    line.appendChild(
                        el("span", "", item.title)
                    );

                    line.appendChild(
                        el(
                            "span",
                            "font-weight:700;" +
                            (
                                item.count >= item.max
                                    ? "color:#ff8a8a;"
                                    : ""
                            ),
                            item.count + " из " + item.max
                        )
                    );

                    body.appendChild(line);

                }

                if (warnings.updatedAt) {

                    body.appendChild(
                        el(
                            "div",
                            "margin-top:8px;color:#7d78b0;" +
                            "font-size:12px;",
                            "Обновлено: " +
                            formatDateTime(
                                warnings.updatedAt
                            )
                        )
                    );

                }

            }

            let confirming = false;

            const unlink = smallButton(
                "Отвязать Telegram",
                async () => {

                    if (!confirming) {

                        confirming = true;

                        unlink.textContent =
                            "Точно отвязать?";

                        return;

                    }

                    try {

                        await ipcRenderer.invoke(
                            "profile-telegram-unlink"
                        );

                    }

                    catch (error) {

                        window.alert(cleanError(error));

                    }

                    refresh();

                }
            );

            unlink.style.background = "#3a3763";

            body.appendChild(unlink);

        }

        function showNotLinked() {

            stopPolling();

            body.textContent = "";

            body.appendChild(
                muted(
                    "Привяжите Telegram, чтобы видеть свои " +
                    "предупреждения в профиле."
                )
            );

            body.appendChild(
                smallButton(
                    "Привязать Telegram",
                    startLinking
                )
            );

        }

        async function startLinking() {

            showLoading();

            try {

                const data =
                    await ipcRenderer.invoke(
                        "profile-telegram-link-code"
                    );

                body.textContent = "";

                body.appendChild(
                    muted(
                        "Откройте бота и нажмите Start. " +
                        "Код действует 10 минут."
                    )
                );

                body.appendChild(
                    el(
                        "div",
                        "margin:12px 0 4px;font-size:22px;" +
                        "font-weight:700;letter-spacing:3px;" +
                        "user-select:all;",
                        data.code
                    )
                );

                if (data.deep_link) {

                    body.appendChild(
                        smallButton(
                            "Открыть Telegram",
                            () => openExternal(
                                data.deep_link
                            )
                        )
                    );

                }

                body.appendChild(
                    el(
                        "div",
                        "margin-top:10px;color:#7d78b0;" +
                        "font-size:12px;",
                        data.bot_username
                            ? "Или отправьте боту @" +
                              data.bot_username +
                              " сообщение: /link " +
                              data.code
                            : "Или отправьте боту сообщение: /link " +
                              data.code
                    )
                );

                body.appendChild(
                    el(
                        "div",
                        "margin-top:10px;color:#a9a3d6;" +
                        "font-size:13px;",
                        "Ожидаем привязку..."
                    )
                );

                stopPolling();

                const startedAt = Date.now();

                pollTimer = setInterval(
                    async () => {

                        if (
                            Date.now() - startedAt >
                            10 * 60 * 1000
                        ) {

                            showNotLinked();

                            return;

                        }

                        try {

                            const status =
                                await ipcRenderer.invoke(
                                    "profile-telegram-status"
                                );

                            if (status.linked) {
                                showLinked(status);
                            }

                        }

                        catch {
                            // Следующая проверка через 4 секунды
                        }

                    },
                    4000
                );

            }

            catch (error) {

                showError(error);

            }

        }

        async function refresh() {

            showLoading();

            try {

                const data =
                    await ipcRenderer.invoke(
                        "profile-telegram-status"
                    );

                if (data.linked) {
                    showLinked(data);
                }
                else {
                    showNotLinked();
                }

            }

            catch (error) {

                showError(error);

            }

        }

        refresh();

    }

    // ---------------- ОКНО ----------------

    async function openProfile() {

        closeProfile();

        const menu =
            document.getElementById(
                "discordMenu"
            );

        if (menu) {
            menu.style.display = "none";
        }

        overlay = el(
            "div",
            "position:fixed;inset:0;" +
            "background:rgba(0,0,0,.7);" +
            "display:flex;align-items:center;" +
            "justify-content:center;" +
            "z-index:2147483645;padding:16px;"
        );

        overlay.addEventListener(
            "mousedown",
            event => {
                if (event.target === overlay) {
                    closeProfile();
                }
            }
        );

        const card = el(
            "div",
            "width:100%;max-width:460px;" +
            "max-height:85vh;overflow-y:auto;" +
            "background:#12102b;color:#fff;" +
            "border:1px solid #7c5cff;" +
            "border-radius:16px;padding:22px;" +
            "box-shadow:0 12px 40px rgba(0,0,0,.6);"
        );

        overlay.appendChild(card);

        card.appendChild(muted("Загрузка профиля..."));

        document.body.appendChild(overlay);

        try {

            const profile =
                await ipcRenderer.invoke(
                    "profile-get"
                );

            if (!overlay) return;

            card.textContent = "";

            card.appendChild(renderHeader(profile));

            if (profile.status !== "not_member") {

                card.appendChild(
                    renderHistory(profile)
                );

                renderTelegram(card);

            }

        }

        catch (error) {

            if (!overlay) return;

            card.textContent = "";

            card.appendChild(
                el(
                    "div",
                    "color:#ff8a8a;font-size:14px;",
                    cleanError(error)
                )
            );

        }

        const close = smallButton(
            "Закрыть",
            closeProfile
        );

        close.style.width = "100%";
        close.style.margin = "18px 0 0 0";
        close.style.background = "#3a3763";

        card.appendChild(close);

    }

    window.openProfile = openProfile;

})();


// ======================================================
// РЕДАКТОР ПРЕДУПРЕЖДЕНИЙ
// ======================================================

(function () {

    const TITLES = {
        members: "Предупреждения участников",
        shoots: "Предупреждения съемок",
        moderators: "Предупреждения модераторов"
    };

    const DEFAULT_MAX = {
        members: 3,
        shoots: 5,
        moderators: 3
    };

    const INPUT_CSS =
        "background:#0b0a1e;color:#fff;" +
        "border:1px solid #3a3763;" +
        "border-radius:8px;padding:8px;" +
        "font-size:14px;box-sizing:border-box;" +
        "height:auto;margin:0;";

    let overlay = null;

    function canEdit() {

        return Boolean(
            discordSession &&
            [
                ROLE_ARCHON,
                ROLE_RIGHT_HAND,
                ROLE_DEPUTY
            ].includes(
                discordSession.role
            )
        );

    }

    window.canEditWarnings = canEdit;

    function el(tag, css, text) {

        const node =
            document.createElement(tag);

        if (css) node.style.cssText = css;

        if (text !== undefined) {
            node.textContent = text;
        }

        return node;

    }

    function cleanError(error) {

        return (
            String(
                (error && error.message) ||
                error ||
                ""
            ).replace(
                /^Error invoking remote method '[^']*':\s*(Error:\s*)?/,
                ""
            ) ||
            "Не удалось выполнить запрос."
        );

    }

    function button(text, background, onClick) {

        const node = el(
            "button",
            "padding:9px 14px;border:none;" +
            "border-radius:10px;cursor:pointer;" +
            "font-size:14px;font-weight:600;" +
            "color:#fff;width:auto;height:auto;" +
            "margin:0;background:" + background + ";",
            text
        );

        node.onclick = onClick;

        return node;

    }

    function closeEditor() {

        if (overlay) {
            overlay.remove();
            overlay = null;
        }

    }

    async function openWarningsEditor() {

        if (!canEdit()) return;

        closeEditor();

        const menu =
            document.getElementById(
                "discordMenu"
            );

        if (menu) menu.style.display = "none";

        overlay = el(
            "div",
            "position:fixed;inset:0;" +
            "background:rgba(0,0,0,.7);" +
            "display:flex;align-items:center;" +
            "justify-content:center;" +
            "z-index:2147483645;padding:16px;"
        );

        const card = el(
            "div",
            "width:100%;max-width:620px;" +
            "max-height:90vh;overflow-y:auto;" +
            "background:#12102b;color:#fff;" +
            "border:1px solid #7c5cff;" +
            "border-radius:16px;padding:22px;" +
            "box-shadow:0 12px 40px rgba(0,0,0,.6);"
        );

        overlay.appendChild(card);

        card.appendChild(
            el(
                "div",
                "color:#a9a3d6;font-size:14px;",
                "Загрузка..."
            )
        );

        document.body.appendChild(overlay);

        let data;

        try {

            data =
                await ipcRenderer.invoke(
                    "warnings-get"
                );

        }

        catch (error) {

            if (!overlay) return;

            card.textContent = "";

            card.appendChild(
                el(
                    "div",
                    "color:#ff8a8a;font-size:14px;" +
                    "margin-bottom:14px;",
                    cleanError(error)
                )
            );

            card.appendChild(
                button(
                    "Закрыть",
                    "#3a3763",
                    closeEditor
                )
            );

            return;

        }

        if (!overlay) return;

        // ---------- данные ----------

        const rows = {};

        for (const key of Object.keys(TITLES)) {

            rows[key] = (
                data.sections[key] || []
            ).map(entry => ({
                id: entry.id || null,
                name:
                    entry.username
                        ? "@" + entry.username
                        : (entry.name || ""),
                count: entry.count,
                max: entry.max
            }));

        }

        card.textContent = "";

        card.appendChild(
            el(
                "div",
                "font-size:20px;font-weight:700;" +
                "margin-bottom:6px;",
                "Предупреждения"
            )
        );

        card.appendChild(
            el(
                "div",
                "color:#a9a3d6;font-size:13px;" +
                "margin-bottom:14px;line-height:1.4;",
                "Имя пишите как @username. Если у человека " +
                "нет username — просто имя. После сохранения " +
                "бот отредактирует сообщение в Telegram."
            )
        );

        function addRow(list, row, container) {

            const line = el(
                "div",
                "display:flex;align-items:center;" +
                "gap:8px;margin:6px 0;"
            );

            const name = el(
                "input",
                INPUT_CSS + "flex:1;min-width:0;"
            );

            name.value = row.name;

            name.placeholder = "@username или имя";

            name.oninput = () => {
                row.name = name.value;
                row.id = null;
            };

            const count = el(
                "input",
                INPUT_CSS + "width:60px;text-align:center;"
            );

            count.type = "number";
            count.min = "0";
            count.max = "99";
            count.value = row.count;

            count.oninput = () => {
                row.count = count.value;
            };

            const max = el(
                "input",
                INPUT_CSS + "width:60px;text-align:center;"
            );

            max.type = "number";
            max.min = "0";
            max.max = "99";
            max.value = row.max;

            max.oninput = () => {
                row.max = max.value;
            };

            const remove = button(
                "✕",
                "#4a2a3d",
                () => {

                    const index = list.indexOf(row);

                    if (index !== -1) {
                        list.splice(index, 1);
                    }

                    line.remove();

                }
            );

            remove.style.padding = "8px 11px";

            line.appendChild(name);
            line.appendChild(count);
            line.appendChild(el("span", "color:#a9a3d6;", "из"));
            line.appendChild(max);
            line.appendChild(remove);

            container.appendChild(line);

        }

        for (const key of Object.keys(TITLES)) {

            const box = el(
                "div",
                "margin-top:16px;padding-top:12px;" +
                "border-top:1px solid #2c2a55;"
            );

            box.appendChild(
                el(
                    "div",
                    "font-size:16px;font-weight:700;" +
                    "margin-bottom:8px;",
                    TITLES[key]
                )
            );

            const container = el("div", "");

            box.appendChild(container);

            for (const row of rows[key]) {
                addRow(rows[key], row, container);
            }

            box.appendChild(
                button(
                    "+ Добавить",
                    "#6d4aff",
                    () => {

                        const row = {
                            id: null,
                            name: "",
                            count: 0,
                            max: DEFAULT_MAX[key]
                        };

                        rows[key].push(row);

                        addRow(rows[key], row, container);

                    }
                )
            );

            card.appendChild(box);

        }

        const status = el(
            "div",
            "margin-top:16px;font-size:14px;" +
            "line-height:1.4;min-height:20px;"
        );

        card.appendChild(status);

        const actions = el(
            "div",
            "display:flex;gap:10px;margin-top:10px;"
        );

        const save = button(
            "Сохранить и обновить в Telegram",
            "#6d4aff",
            async () => {

                const payload = {};

                for (const key of Object.keys(TITLES)) {

                    payload[key] = [];

                    for (const row of rows[key]) {

                        const label =
                            String(row.name || "").trim();

                        if (!label) continue;

                        const count = Number(row.count);
                        const max = Number(row.max);

                        if (
                            !Number.isInteger(count) ||
                            !Number.isInteger(max) ||
                            count < 0 ||
                            max < 0
                        ) {

                            status.style.color = "#ff8a8a";

                            status.textContent =
                                "Проверьте числа у «" +
                                label + "».";

                            return;

                        }

                        const isUser = label.startsWith("@");

                        payload[key].push({
                            id: row.id || null,
                            username:
                                isUser
                                    ? label.slice(1)
                                    : "",
                            name:
                                isUser
                                    ? ""
                                    : label,
                            count,
                            max
                        });

                    }

                }

                save.disabled = true;

                status.style.color = "#a9a3d6";

                status.textContent = "Сохраняем...";

                try {

                    const result =
                        await ipcRenderer.invoke(
                            "warnings-save",
                            payload
                        );

                    const results =
                        result.results || [];

                    const lines =
                        results.map(
                            item =>
                                item.label + ": " +
                                (
                                    item.ok
                                        ? (
                                            item.created
                                                ? "бот опубликовал сообщение"
                                                : "сообщение обновлено"
                                        )
                                        : "ошибка — " + item.error
                                )
                        );

                    const failed =
                        results.some(
                            item => !item.ok
                        );

                    status.style.color =
                        failed
                            ? "#ffcf8a"
                            : "#8affb0";

                    status.textContent =
                        "Готово. " + lines.join(". ") + ".";

                }

                catch (error) {

                    status.style.color = "#ff8a8a";

                    status.textContent = cleanError(error);

                }

                save.disabled = false;

            }
        );

        actions.appendChild(save);

        actions.appendChild(
            button(
                "Закрыть",
                "#3a3763",
                closeEditor
            )
        );

        card.appendChild(actions);

    }

    window.openWarningsEditor = openWarningsEditor;

})();

// ======================================================
// LOAD DISCORD USERS
// ======================================================

async function loadModerationUsers() {

    const select =
        document.getElementById(
            "moderationUser"
        );

    select.disabled =
        true;

    select.innerHTML =
        `
        <option value="">
            Загрузка пользователей...
        </option>
        `;

    try {

        if (!discordSession) {

            throw new Error(
                "Discord не авторизован."
            );

        }

        const encodedSession =
            encodeBase64UTF8(
                JSON.stringify(
                    discordSession
                )
            );

        let type =
            "members";

        if (
            moderationAction === "unmute"
        ) {

            type =
                "muted";

        }

        if (
            moderationAction === "unban"
        ) {

            type =
                "banned";

        }

        const response =
            await fetch(
                `${WORKER_URL}/api/discord/moderation/users?type=${type}`,
                {
                    method: "GET",

                    headers: {
                        "Authorization":
                            `Bearer ${encodedSession}`
                    }
                }
            );

        const data =
            await response.json();

        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.error ||
                "Не удалось получить список пользователей."
            );

        }

        moderationUsers =
            Array.isArray(
                data.users
            )
                ? data.users
                : [];

        select.innerHTML =
            "";

        const noneOption =
            document.createElement(
                "option"
            );

        noneOption.value =
            "";

        noneOption.textContent =
            "Нет";

        select.appendChild(
            noneOption
        );

        moderationUsers
            .sort(
                (a, b) =>
                    (
                        a.displayName ||
                        a.username ||
                        ""
                    ).localeCompare(
                        b.displayName ||
                        b.username ||
                        "",
                        "ru"
                    )
            )
            .forEach(
                user => {

                    const option =
                        document.createElement(
                            "option"
                        );

                    option.value =
                        String(
                            user.id
                        );

                    option.textContent =
                        user.displayName
                            ? (
                                user.username
                                    ? `${user.displayName} (@${user.username})`
                                    : user.displayName
                              )
                            : (
                                user.username
                                    ? `@${user.username}`
                                    : String(user.id)
                              );

                    select.appendChild(
                        option
                    );

                }
            );

    }

    catch (error) {

        console.error(
            "Ошибка списка Discord:",
            error
        );

        select.innerHTML =
            `
            <option value="">
                Нет
            </option>
            `;

        showModerationError(
            error.message ||
            "Не удалось получить пользователей Discord."
        );

    }

    finally {

        select.disabled =
            false;

    }

}


// ======================================================
// LOAD TELEGRAM USERS
// ======================================================

async function loadTelegramUsers() {

    const select =
        document.getElementById(
            "telegramUser"
        );

    if (!select) {

        console.error(
            "Telegram: элемент telegramUser не найден."
        );

        return;

    }

    select.disabled =
        true;

    select.innerHTML =
        `
        <option value="">
            Загрузка пользователей...
        </option>
        `;

    telegramUsers = [];

    try {

        /*
         * ВАЖНО:
         *
         * Используем ipcRenderer напрямую.
         *
         * window.electronAPI у тебя НЕ существует,
         * поэтому старый вызов давал ошибку.
         */

        const members =
            await ipcRenderer.invoke(
                "telegram-get-members"
            );

        console.log(
            "Telegram /api/members:",
            members
        );

        if (!Array.isArray(members)) {

            throw new Error(
                "Telegram: Worker вернул некорректный список пользователей."
            );

        }

        telegramUsers =
            members.filter(
                user =>
                    user &&
                    user.id !== null &&
                    user.id !== undefined
            );

        select.innerHTML =
            "";

        const noneOption =
            document.createElement(
                "option"
            );

        noneOption.value =
            "";

        noneOption.textContent =
            "Нет";

        select.appendChild(
            noneOption
        );

        for (
            const user of telegramUsers
        ) {

            const option =
                document.createElement(
                    "option"
                );

            /*
             * Здесь должен быть НАСТОЯЩИЙ
             * Telegram numeric ID.
             */

            option.value =
                String(
                    user.id
                );

            let displayName = "";

            if (user.username) {

                displayName =
                    "@" +
                    String(
                        user.username
                    );

            }
            else {

                displayName =
                    [
                        user.first_name,
                        user.last_name
                    ]
                        .filter(Boolean)
                        .join(" ");

            }

            if (!displayName) {

                displayName =
                    String(
                        user.id
                    );

            }

            option.textContent =
                displayName;

            select.appendChild(
                option
            );

        }

        /*
         * Даже если список пустой,
         * это не ошибка.
         */

        console.log(
            "Telegram пользователи загружены:",
            telegramUsers.length
        );

    }

    catch (error) {

        console.error(
            "Ошибка загрузки Telegram пользователей:",
            error
        );

        telegramUsers = [];

        select.innerHTML =
            `
            <option value="">
                Нет
            </option>
            `;

        showModerationError(
            "Telegram: " +
            (
                error?.message ||
                "не удалось загрузить пользователей."
            )
        );

    }

    finally {

        select.disabled =
            false;

    }

}


// ======================================================
// MUTE DURATION
// ======================================================

function getMuteDuration() {

    const amountInput =
        document.getElementById(
            "muteAmount"
        );

    const unitInput =
        document.getElementById(
            "muteUnit"
        );

    if (!amountInput) {

        throw new Error(
            "Поле времени мута не найдено."
        );

    }

    const amount =
        Number(
            amountInput.value
        );

    if (
        !Number.isFinite(amount) ||
        amount <= 0
    ) {

        throw new Error(
            "Укажите конкретное время мута."
        );

    }

    const rawUnit =
        unitInput
            ? String(
                unitInput.value || ""
              )
                .trim()
                .toLowerCase()
            : "";

    const multipliers = {

        s:
            1000,

        m:
            60 *
            1000,

        h:
            60 *
            60 *
            1000,

        d:
            24 *
            60 *
            60 *
            1000

    };

    const multiplier =
        multipliers[
            rawUnit
        ];

    if (!multiplier) {

        throw new Error(
            "Неизвестная единица времени: " +
            rawUnit
        );

    }

    const duration =
        amount *
        multiplier;

    const maxDuration =
        28 *
        24 *
        60 *
        60 *
        1000;

    if (
        duration >
        maxDuration
    ) {

        throw new Error(
            "Максимальное время мута — 28 дней."
        );

    }

    return duration;

}

// ======================================================
// CONFIRM MODERATION
// ======================================================

async function confirmModeration() {

    hideModerationError();

    try {

        const discordSelect =
            document.getElementById(
                "moderationUser"
            );

        const telegramSelect =
            document.getElementById(
                "telegramUser"
            );

        const discordId =
            discordSelect &&
            discordSelect.value &&
            discordSelect.value !== "Нет"
                ? String(
                    discordSelect.value
                  ).trim()
                : "";

        const telegramId =
            telegramSelect &&
            telegramSelect.value &&
            telegramSelect.value !== "Нет"
                ? String(
                    telegramSelect.value
                  ).trim()
                : "";

        if (
            !discordId &&
            !telegramId
        ) {
            throw new Error(
                "Выберите пользователя Discord или Telegram."
            );
        }


        // ==============================================
        // ПРИЧИНА
        // ==============================================

        let reason = "";

        if (
            moderationAction ===
            "mute"
        ) {

            const input =
                document.getElementById(
                    "muteReason"
                );

            reason =
                input
                    ? String(
                        input.value || ""
                      ).trim()
                    : "";

        } else {

            const input =
                document.getElementById(
                    "actionReason"
                );

            reason =
                input
                    ? String(
                        input.value || ""
                      ).trim()
                    : "";

        }


        if (!reason) {

            throw new Error(
                "Укажите причину."
            );

        }


        // ==============================================
        // ВРЕМЯ МУТА
        // ==============================================

        let duration = null;

        if (
            moderationAction ===
            "mute"
        ) {

            duration =
                getMuteDuration();

            console.log(
                "Время мута:",
                duration,
                "мс"
            );

        }


        // ==============================================
        // ПОЛНЫЕ ДАННЫЕ
        // ==============================================

        const actionData = {

            action:
                moderationAction,

            discordUserId:
                discordId || null,

            telegramUserId:
                telegramId || null,

            duration:
                duration,

            reason:
                reason

        };


        console.log(
            "Модерация:",
            actionData
        );


        const confirmButton =
            document.getElementById(
                "moderationConfirm"
            );

        confirmButton.disabled =
            true;

        confirmButton.textContent =
            "Выполнение...";


        await sendModerationAction(
            actionData
        );


        window.alert(
            "Действие успешно выполнено."
        );


        closeModerationModal();

    }

    catch (error) {

        console.error(
            "Ошибка модерации:",
            error
        );

        showModerationError(
            error?.message ||
            String(error)
        );

    }

    finally {

        const button =
            document.getElementById(
                "moderationConfirm"
            );

        if (button) {

            button.disabled =
                false;

            updateModerationModal();

        }

    }

}


// ======================================================
// SEND MODERATION ACTION
// ======================================================

async function sendModerationAction(
    actionData
) {

    if (!actionData) {

        throw new Error(
            "Данные модерации отсутствуют."
        );

    }


    const action =
        String(
            actionData.action || ""
        ).trim();


    const discordUserId =
        actionData.discordUserId
            ? String(
                actionData.discordUserId
              ).trim()
            : "";


    const telegramUserId =
        actionData.telegramUserId
            ? String(
                actionData.telegramUserId
              ).trim()
            : "";


    const duration =
        actionData.duration;


    const reason =
        actionData.reason || "";


    if (
        !discordUserId &&
        !telegramUserId
    ) {

        throw new Error(
            "Не выбран пользователь."
        );

    }


    // ==================================================
    // DISCORD
    // ==================================================

    if (discordUserId) {

        try {

            await ipcRenderer.invoke(
                "discord-moderation",
                {
                    action:
                        action,

                    userId:
                        discordUserId,

                    duration:
                        duration,

                    reason:
                        reason
                }
            );

        }

        catch (error) {

            throw new Error(
                "Discord: " +
                (
                    error?.message ||
                    String(error)
                )
            );

        }

    }


    // ==================================================
    // TELEGRAM
    // ==================================================

    if (telegramUserId) {

        const numericTelegramId =
            Number(
                telegramUserId
            );


        if (
            !Number.isFinite(
                numericTelegramId
            )
        ) {

            throw new Error(
                "Некорректный Telegram ID."
            );

        }


        const payload = {

            action:
                action,

            telegram_user_id:
                numericTelegramId,

            reason:
                reason,

            moderator:
                discordSession?.username ||
                discordSession?.globalName ||
                "SkyNix"

        };


        // ==============================================
        // TELEGRAM MUTE
        // ==============================================

        if (
            action ===
            "mute"
        ) {

            const durationMs =
                Number(
                    duration
                );


            console.log(
                "Telegram duration:",
                durationMs
            );


            if (
                !Number.isFinite(
                    durationMs
                ) ||
                durationMs <= 0
            ) {

                throw new Error(
                    "Некорректное время мута."
                );

            }


            const maxDuration =
                28 *
                24 *
                60 *
                60 *
                1000;


            if (
                durationMs >
                maxDuration
            ) {

                throw new Error(
                    "Максимальное время мута — 28 дней."
                );

            }


            payload.duration_ms =
                durationMs;

        }


        console.log(
            "Telegram moderation:",
            payload
        );


        try {

            await ipcRenderer.invoke(
                "telegram-moderation",
                payload
            );

        }

        catch (error) {

            throw new Error(
                "Telegram: " +
                (
                    error?.message ||
                    String(error)
                )
            );

        }

    }


    return {
        ok: true
    };

}


// ======================================================
// MODAL ERROR
// ======================================================

function showModerationError(
    message
) {

    const error =
        document.getElementById(
            "moderationError"
        );

    error.textContent =
        message;

    error.classList.add(
        "visible"
    );

}


function hideModerationError() {

    const error =
        document.getElementById(
            "moderationError"
        );

    error.textContent =
        "";

    error.classList.remove(
        "visible"
    );

}


// ======================================================
// CLOSE MODAL ON BACKGROUND CLICK
// ======================================================

document.getElementById(
    "moderationOverlay"
).addEventListener(
    "click",
    event => {

        if (
            event.target ===
            event.currentTarget
        ) {

            closeModerationModal();

        }

    }
);


// ======================================================
// START
// ======================================================

loadDiscordSession();


// ======================================================
// CHECK ROLE EVERY 10 SECONDS
// ======================================================

setInterval(
    refreshDiscordRole,
    10000
);

</script>
