<title>SkyNix</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {

    margin: 0;

    background:
        radial-gradient(
            circle at top,
            #171535 0%,
            #0b0b16 55%
        );

    color: white;

    font-family: Arial, sans-serif;

    user-select: none;

    overflow: hidden;
}

input,
textarea,
select {

    user-select: text;

    -webkit-user-select: text;

    pointer-events: auto;
}

input {
    cursor: text;
}

input[type="number"] {

    user-select: text;

    -webkit-user-select: text;

    cursor: text;
}

.modal input {

    user-select: text;

    -webkit-user-select: text;

    pointer-events: auto;
}

.modal input:focus {

    user-select: text;

    -webkit-user-select: text;
}

.container {

    width: 100%;

    padding:
        38px 38px 30px;

    text-align: center;
}

.logo {

    font-size: 40px;

    font-weight: 700;

    letter-spacing: 1px;

    background:
        linear-gradient(
            90deg,
            #5b8cff,
            #9a5cff
        );

    -webkit-background-clip: text;

    -webkit-text-fill-color: transparent;

    margin-bottom: 8px;
}

.subtitle {

    color: #85859c;

    font-size: 14px;

    margin-bottom: 22px;
}

.actions {

    width: 100%;
}

button {

    width: 100%;

    height: 52px;

    margin: 6px 0;

    border-radius: 12px;

    border:
        1px solid #363653;

    background:
        #1d1d34;

    color: white;

    font-size: 15px;

    font-weight: 600;

    cursor: pointer;

    transition:
        background .15s,
        transform .15s;
}

button:hover {

    background:
        #292949;

    transform:
        translateY(-1px);
}

button:active {

    transform:
        translateY(0);
}

button:disabled {

    opacity: .5;

    cursor: default;

    transform: none;
}


/* ======================================================
   БЛОК КНОПОК МОДЕРАЦИИ
   ====================================================== */

.moderation-start {

    margin-top: 16px;
}


/* ====================================================== */

.discord-area {

    position: absolute;

    left: 18px;

    bottom: 16px;

    text-align: left;
}

.discord-status {

    display: flex;

    align-items: center;

    gap: 8px;

    color: #77778c;

    font-size: 13px;

    cursor: pointer;

    padding: 5px 7px;

    border-radius: 7px;

    transition:
        background .15s;
}

.discord-status:hover {

    background:
        rgba(255,255,255,.05);
}

.status-dot {

    width: 9px;

    height: 9px;

    min-width: 9px;

    border-radius: 50%;

    background: #77778c;
}

.discord-gray {
    color: #77778c;
}

.discord-gray .status-dot {
    background: #77778c;
}

.discord-red {
    color: #ff5b63;
}

.discord-red .status-dot {
    background: #ff4d57;
}

.discord-orange {
    color: #ffad42;
}

.discord-orange .status-dot {
    background: #ff9d22;
}

.discord-green {
    color: #8ee6a8;
}

.discord-green .status-dot {
    background: #72df91;
}

.discord-login {

    width: auto;

    height: auto;

    margin-top: 5px;

    padding:
        6px 9px;

    border-radius: 7px;

    font-size: 12px;
}

.discord-menu {

    display: none;

    position: absolute;

    left: 0;

    bottom: 34px;

    width: 225px;

    padding: 12px;

    border-radius: 10px;

    background:
        #17172b;

    border:
        1px solid #383855;

    box-shadow:
        0 8px 30px rgba(0,0,0,.45);
}

.discord-menu-name {

    font-size: 14px;

    font-weight: bold;

    margin-bottom: 3px;
}

.discord-menu-role {

    color: #8a8aa0;

    font-size: 12px;

    margin-bottom: 10px;
}

.discord-logout {

    width: 100%;

    height: 34px;

    margin: 0;

    font-size: 12px;

    border-radius: 7px;
}

.version {

    position: absolute;

    right: 18px;

    bottom: 17px;

    color: #5f5f77;

    font-size: 12px;
}

.modal-overlay {

    display: none;

    position: fixed;

    inset: 0;

    z-index: 1000;

    align-items: center;

    justify-content: center;

    background:
        rgba(0,0,0,.72);
}

.modal-overlay.visible {

    display: flex;
}

.modal {

    width: 430px;

    max-width:
        calc(100% - 30px);

    max-height:
        calc(100% - 30px);

    overflow-y: auto;

    padding: 20px;

    border-radius: 14px;

    border:
        1px solid #383855;

    background:
        #17172b;

    box-shadow:
        0 20px 60px rgba(0,0,0,.65);
}

.modal-title {

    font-size: 21px;

    font-weight: 700;

    margin-bottom: 5px;
}

.modal-subtitle {

    color: #85859c;

    font-size: 12px;

    line-height: 1.4;

    margin-bottom: 18px;
}

.modal-label {

    display: block;

    color: #aaaac0;

    font-size: 12px;

    margin:
        12px 0 6px;
}

.modal input,
.modal select {

    width: 100%;

    height: 42px;

    user-select: text;

    -webkit-user-select: text;

    pointer-events: auto;

    cursor: text;

    padding:
        0 11px;

    border:
        1px solid #363653;

    border-radius: 9px;

    background:
        #10101e;

    color: white;

    outline: none;

    font-family: Arial, sans-serif;

    font-size: 13px;
}

.modal select {
    cursor: pointer;
}

.modal input:focus,
.modal select:focus {

    border-color:
        #5b8cff;
}

.modal select:disabled {

    opacity: .55;
}

.modal-actions {

    display: flex;

    gap: 8px;

    margin-top: 18px;
}

.modal-actions button {

    width: 50%;

    height: 42px;

    margin: 0;

    font-size: 13px;
}

.modal-error {

    display: none;

    margin-top: 12px;

    color: #ff777f;

    font-size: 12px;

    line-height: 1.4;
}

.modal-error.visible {
    display: block;
}

.telegram-info {

    color: #77778c;

    font-size: 11px;

    margin-top: 5px;

    line-height: 1.4;
}

.loading {
    opacity: .65;
}

</style>

<style id="skynix-theme">
/* ====== SkyNix 2.0 · Glass ====== */
:root{--violet:#6d4aff;--blue:#3b82f6;--glass:rgba(var(--ov),.06);--line:rgba(var(--ov),.12);--muted:#a9aee0;--text:#eef0ff}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:Manrope,"Segoe UI",Arial,sans-serif;overflow:hidden}
.g-orbs{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.g-orbs i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;animation:orbFloat 18s ease-in-out infinite alternate}
.g-orbs i:nth-child(1){width:520px;height:520px;right:-120px;top:-160px;background:var(--orb1)}
.g-orbs i:nth-child(2){width:480px;height:480px;left:-140px;bottom:-180px;background:var(--orb2);animation-duration:23s}
.g-orbs i:nth-child(3){width:320px;height:320px;left:46%;top:38%;background:var(--orb3);opacity:.28;animation-duration:29s}
@keyframes orbFloat{from{transform:translate(0,0) scale(1)}to{transform:translate(60px,-40px) scale(1.15)}}
@keyframes cardIn{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.94)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes shimmer{to{background-position:200% center}}
@keyframes barGrow{from{width:0}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(114,223,145,.55)}70%{box-shadow:0 0 0 9px rgba(114,223,145,0)}100%{box-shadow:0 0 0 0 rgba(114,223,145,0)}}
#sidebar{position:fixed;inset:0 auto 0 0;width:250px;padding:26px 16px;display:flex;flex-direction:column;gap:2px;z-index:20;border-right:1px solid rgba(var(--ov),.08);background:var(--side-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);animation:fadeIn .6s both}
.g-brand{font-weight:800;font-size:26px;margin:0 10px 24px;background:var(--brand-grad);background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 6s linear infinite}
.g-nav{display:flex;align-items:center;gap:12px;width:100%;height:auto;margin:2px 0;padding:11px 14px;border:none;border-radius:12px;background:transparent;color:var(--nav-text);font:700 14px Manrope,"Segoe UI",Arial,sans-serif;text-align:left;cursor:pointer;transition:background .2s,transform .2s,color .2s,box-shadow .2s}
.g-nav svg{flex:none;transition:transform .25s}
.g-nav:hover{background:rgba(var(--ov),.08);color:var(--text-strong);transform:translateX(4px)}
.g-nav:hover svg{transform:scale(1.15) rotate(-6deg)}
.g-nav.active{background:linear-gradient(90deg,var(--violet),var(--blue));color:var(--on-accent);box-shadow:0 8px 24px rgba(var(--acc-rgb),.38)}
.version{position:fixed;left:26px;right:auto;bottom:18px;color:var(--dim);z-index:21}
.container{position:relative;z-index:1;height:100vh;overflow-y:auto;margin-left:250px;width:calc(100% - 250px);overflow-x:hidden;padding:96px 36px 40px;text-align:left;scroll-behavior:smooth}
.logo,.subtitle{display:none}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;align-items:start}
.g-hero{grid-column:1/-1;animation:cardIn .6s cubic-bezier(.2,.8,.2,1) backwards}
.g-hero h1{margin:0;font-size:32px;font-weight:800;letter-spacing:-.3px}
.g-hero p{margin:6px 0 0;color:var(--muted);font-size:15px}
.g-card{position:relative;padding:22px;border-radius:20px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.25);animation:cardIn .65s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*70ms + 120ms);transition:transform .25s,border-color .25s,box-shadow .25s}
.g-card:hover{transform:translateY(-4px);border-color:rgba(var(--acc2-rgb),.55);box-shadow:0 18px 44px rgba(var(--acc-rgb),.38)}
.g-full{grid-column:1/-1}
.g-card-title{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.g-text{color:var(--text-soft);font-size:14px;line-height:1.5;margin:0 0 16px}
.g-muted{color:var(--muted);font-size:14px;line-height:1.45}
.g-row{display:flex;justify-content:space-between;gap:12px;font-size:14px;margin:0 0 7px}
.g-row b{font-weight:800}
.g-bar{height:8px;border-radius:8px;background:rgba(var(--ov),.1);overflow:hidden;margin-bottom:16px}
.g-bar i{display:block;height:100%;width:var(--w);border-radius:8px;background:#43e0a4;animation:barGrow 1.1s cubic-bezier(.2,.8,.2,1) backwards .35s}
.g-bar i.warn{background:#ffc46b}.g-bar i.danger{background:linear-gradient(90deg,#ff7a7a,#ff4d6d)}
.g-btn{position:relative;overflow:hidden;width:auto;height:auto;margin:0;padding:12px 18px;border-radius:12px;border:1px solid var(--line);background:rgba(var(--ov),.08);color:var(--text);font:800 14px Manrope,"Segoe UI",Arial,sans-serif;cursor:pointer;transition:transform .18s,box-shadow .18s,background .18s}
.g-btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(var(--ov),.3) 50%,transparent 70%);transform:translateX(-130%);transition:transform .65s}
.g-btn:hover{background:rgba(var(--ov),.14);transform:translateY(-2px)}
.g-btn:hover::after{transform:translateX(130%)}
.g-btn:active{transform:translateY(0) scale(.97)}
.g-btn.primary{background:linear-gradient(90deg,var(--violet),var(--blue));border-color:transparent;box-shadow:0 8px 22px rgba(var(--acc-rgb),.35)}
.g-btn.danger{background:rgba(255,77,109,.16);border-color:rgba(255,77,109,.5)}
.g-btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.g-event{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid rgba(var(--ov),.07);font-size:14px}
.g-event:last-child{border-bottom:none}.g-event small{color:var(--dim);white-space:nowrap}
.discord-area{position:fixed;left:auto;bottom:auto;top:22px;right:28px;z-index:30;animation:fadeIn .6s .2s both}
.discord-status{padding:9px 16px;border-radius:40px;background:rgba(var(--ov),.07);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-weight:700;transition:background .2s,transform .2s}
.discord-status:hover{background:rgba(var(--ov),.13);transform:translateY(-1px)}
.discord-green .status-dot{animation:pulse 2s infinite}
.discord-login{display:inline-block;margin-top:0;padding:9px 16px;border-radius:40px;border:none;background:linear-gradient(90deg,var(--violet),var(--blue));font-size:13px;font-weight:800}
.discord-menu{bottom:auto;left:auto;right:0;top:50px;width:250px;border-radius:16px;background:var(--modal-bg);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);animation:pop .22s both}
.discord-logout{height:38px;border-radius:10px}
.modal-overlay{background:var(--scrim);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
.modal-overlay.visible{animation:fadeIn .2s both}
.modal,.g-modal{border-radius:22px;border:1px solid rgba(var(--ov),.14);background:var(--modal-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 24px 70px rgba(0,0,0,.6)}
.modal-overlay.visible .modal,.g-modal{animation:pop .32s cubic-bezier(.2,.9,.3,1.15) both}
.g-overlay{backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);animation:fadeIn .2s both}
.modal input,.modal select{border-radius:12px;background:var(--field-bg);border-color:rgba(var(--ov),.14);transition:border-color .2s,box-shadow .2s}
.modal input:focus,.modal select:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(var(--acc2-rgb),.25)}
.modal-actions button:last-child{background:linear-gradient(90deg,var(--violet),var(--blue));border-color:transparent}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:rgba(var(--ov),.14);border-radius:10px;border:2px solid transparent;background-clip:content-box}
@media (max-width:820px){
body{overflow:hidden}
#sidebar{inset:auto 0 0 0;width:100%;height:auto;flex-direction:row;gap:2px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));border-right:none;border-top:1px solid rgba(var(--ov),.1);overflow-x:auto;background:var(--side-bg-m)}
.g-brand,.version{display:none}
.g-nav{flex-direction:column;gap:4px;min-width:72px;width:auto;padding:8px 10px;font-size:11px;text-align:center;margin:0}
.g-nav:hover{transform:none}
.container{margin-left:0;width:100%;padding:84px 16px 110px}
.g-hero h1{font-size:25px}
.discord-area{top:calc(14px + env(safe-area-inset-top));right:12px}
.discord-status{padding:8px 12px;font-size:12px}
.modal{width:100%}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
.g-overlay>.g-modal{background:var(--modal-bg)!important;border:1px solid rgba(var(--ov),.14)!important;border-radius:22px!important;box-shadow:0 24px 70px rgba(0,0,0,.6)!important}
.g-wo{position:fixed;inset:0;z-index:2147483645;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--scrim);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);animation:fadeIn .2s both}
.g-wo.closing{animation:fadeOut .18s both}
@keyframes fadeOut{to{opacity:0}}

.g-win.wide{max-width:680px}
.g-wo.closing .g-win{opacity:0;transform:scale(.96);transition:all .18s}
.g-win-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 14px}
.g-win-head h2{margin:0;font-size:22px;font-weight:800}

.g-x:hover{background:rgba(255,77,109,.3);transform:rotate(90deg)}

.g-hero-w{display:flex;align-items:center;gap:18px;padding:18px;margin:6px 0 4px;border-radius:20px;background:linear-gradient(135deg,rgba(var(--acc-rgb),.28),rgba(59,130,246,.14));border:1px solid rgba(var(--ov),.12);animation:cardIn .5s backwards}
.g-hero-name{font-size:24px;font-weight:800;word-break:break-word;margin-bottom:8px}
.g-av{position:relative;flex:none;width:var(--s);height:var(--s);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:calc(var(--s)*.4);background:linear-gradient(135deg,var(--accent2),var(--blue));box-shadow:0 0 0 3px rgba(var(--ov),.14),0 8px 26px rgba(var(--acc-rgb),.45);overflow:hidden}

.g-sec{margin-top:22px}
.g-sec h3{margin:0 0 12px;font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}

.g-tl-meta{color:var(--dim);font-size:12px;margin:2px 0}

.g-chip.ok{background:rgba(67,224,164,.16);color:#8ef0c4}
.g-code{margin:6px 0 14px;font-size:30px;font-weight:800;letter-spacing:6px;user-select:all;text-align:center;padding:14px;border-radius:16px;background:var(--field-bg);border:1px dashed rgba(var(--ov),.25)}
.g-muted.small{font-size:12px;margin-top:10px}
.g-code.small-code{font-size:19px;letter-spacing:1px;margin:2px 0 12px;word-break:break-all}
.waiting{animation:pulseText 1.6s infinite}
@keyframes pulseText{50%{opacity:.4}}
.g-error{color:#ff8a8a;font-size:14px;margin-bottom:12px;line-height:1.4}
.g-bars{margin:6px 0 14px}
.g-search{width:100%;height:46px;margin:2px 0 12px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:var(--field-bg);color:var(--text-strong);font:600 14px Manrope,"Segoe UI",Arial,sans-serif;outline:none;transition:border-color .2s,box-shadow .2s}
.g-search:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(var(--acc2-rgb),.25)}
.g-tabs{display:flex;gap:6px;padding:5px;border-radius:14px;background:var(--field-bg);margin-bottom:14px}
.g-tab{flex:1;height:auto;margin:0;padding:10px;border:none;border-radius:10px;background:transparent;color:var(--nav-text);font:700 13px Manrope,"Segoe UI",Arial,sans-serif;cursor:pointer;transition:background .25s,color .25s}

  var PLURAL = {
    s:[["секунда","секунды","секунд"],["second","seconds"]], m:[["минута","минуты","минут"],["minute","minutes"]],
    h:[["час","часа","часов"],["hour","hours"]], d:[["день","дня","дней"],["day","days"]]
  };
  var WORDS = {};
  Object.keys(PLURAL).forEach(function (k) { var r = PLURAL[k][0], e = PLURAL[k][1]; WORDS[r[0]] = [e[0], e[1]]; WORDS[r[1]] = [e[0], e[1]]; WORDS[r[2]] = [e[0], e[1]]; });

  function tr1(s) {
    if (EN.hasOwnProperty(s)) return EN[s];
    var m = s.match(/^на (\d+) (\S+)$/);
    if (m && WORDS[m[2]]) return "for " + m[1] + " " + (Number(m[1]) === 1 ? WORDS[m[2]][0] : WORDS[m[2]][1]);
    m = s.match(/^(.+?) на (\d+) (\S+)$/);
    if (m && WORDS[m[3]] && EN.hasOwnProperty(m[1])) return EN[m[1]] + " for " + m[2] + " " + (Number(m[2]) === 1 ? WORDS[m[3]][0] : WORDS[m[3]][1]);
    m = s.match(/^Пинг (\d+) мс$/);
    if (m) return "Ping " + m[1] + " ms";
    m = s.match(/^(\d+) \/ (\d+) игроков$/);
    if (m) return m[1] + " / " + m[2] + " players";
    m = s.match(/^(\d+) из (\d+)$/);
    if (m) return m[1] + " of " + m[2];
    m = s.match(/^(\d+) (игроков|мс)$/);
    if (m) return m[1] + (m[2] === "мс" ? " ms" : " players");
    m = s.match(/^✅ Участник SkyNix \((.+)\)$/);
    if (m) return "✅ SkyNix member (" + (tr1(m[1]) || m[1]) + ")";
    m = s.match(/^Версия (.+)$/);
    if (m) return "Version " + m[1];
    m = s.match(/^Ник привязан: (.+)$/);
    if (m) return "Nickname linked: " + m[1];
    return null;
  }
  function tr(str) {
    if (!str) return str;
    var lead = str.match(/^\s*/)[0], tail = str.match(/\s*$/)[0];
    var core = str.trim();
    if (!core) return str;
    var r = tr1(core);
    if (r !== null) return lead + r + tail;
    // составные строки: «Мут на 5 минут · Имя · причина», «Доброе утро, Имя», «Причина: текст»
    var parts = core.split(/( · |, |: )/), changed = false;
    for (var i = 0; i < parts.length; i += 2) {
      var t = tr1(parts[i]);

  }

  var texts = new WeakMap(), attrs = new WeakMap(), ATTRS = ["placeholder", "title", "aria-label"];
  var busy = false;

  function doText(n) {
    var e = texts.get(n);

    doAttrs(node);
    for (var c = node.firstChild; c; c = c.nextSibling) walk(c);
  }
  function restore(node) {
    if (node.nodeType === 3) { var e = texts.get(node); if (e && node.data === e.en) node.data = e.ru; texts.delete(node); return; }
    if (node.nodeType !== 1) return;
    var map = attrs.get(node);
    if (map) { ATTRS.forEach(function (a) { if (map[a] && node.getAttribute(a) === map[a].en) node.setAttribute(a, map[a].ru); }); attrs.delete(node); }
    for (var c = node.firstChild; c; c = c.nextSibling) restore(c);

    if (!document.body) return;

    document.title = lang === "en" ? document.title : document.title;
  }

  window.SkyI18n = {
    get lang() { return lang; },
    get theme() { return themePref; },
    tr: tr,
    t: function (s) { return lang === "en" ? tr(s) : s; },
    setLang: function (l) {
      lang = l === "en" ? "en" : "ru";
      store.set("skynix_lang", lang);
      root.lang = lang;

    },
    setTheme: function (p) {
      themePref = THEMES.indexOf(p) < 0 ? "glass" : p;
      store.set("skynix_theme", themePref);
      applyTheme();
    }
  };
  window.tt = window.SkyI18n.t;

  function init() { startObserver(); translateAll(); }

// ======================================================
// НЕБЛОКИРУЮЩИЕ СООБЩЕНИЯ ВМЕСТО window.alert
// ------------------------------------------------------
// Системный alert в Electron (Windows) после закрытия
// «ломает» фокус окна: в полях ввода нельзя печатать,
// списки не выбираются, пока окно не свернуть/развернуть.
// Поэтому показываем сообщение внутри приложения.
// ======================================================

(function () {

    let container = null;

    function getContainer() {

        if (container && container.isConnected) {
            return container;
        }

        container =
            document.createElement("div");

        container.style.cssText =
            "position:fixed;left:0;right:0;bottom:24px;" +
            "display:flex;flex-direction:column;" +
            "align-items:center;gap:8px;" +
            "z-index:2147483647;pointer-events:none;";

        document.body.appendChild(container);

        return container;

    }

    window.alert = function (message) {

        try {

            const toast =
                document.createElement("div");

            toast.textContent =
                String(message ?? "");

            toast.style.cssText =
                "max-width:80%;padding:12px 18px;" +
                "border-radius:12px;font-size:14px;" +
                "line-height:1.4;color:#fff;" +
                "background:#1b1740;" +
                "border:1px solid #7c5cff;" +
                "box-shadow:0 8px 24px rgba(0,0,0,.45);" +
                "opacity:0;transition:opacity .2s;" +
                "pointer-events:auto;";

            getContainer().appendChild(toast);

            requestAnimationFrame(
                () => {
                    toast.style.opacity = "1";
                }
            );

            const hide = () => {

                toast.style.opacity = "0";

                setTimeout(
                    () => toast.remove(),
                    250
                );

            };

            toast.onclick = hide;

            setTimeout(
                hide,
                Math.min(
                    12000,
                    3500 + toast.textContent.length * 40
                )
            );

        }

        catch (error) {

            console.error(
                "Toast:",
                error
            );

        }

    };

})();


// ======================================================
// СООБЩЕНИЯ О МУТЕ / БАНЕ (приходят от модераторов)
// ======================================================

(function () {

    const queue = [];
    const seen = new Set();

    let overlay = null;
    let current = null;

    function el(tag, css, text) {

        const node =
            document.createElement(tag);

        if (css) node.style.cssText = css;

        if (text !== undefined) {
            node.textContent = text;
        }

        return node;

    }

    function close() {

        if (current) {

            ipcRenderer
                .invoke(
                    "moderation-notice-ack",
                    [current.id]
                )
                .catch(() => {});

        }

        current = null;

        if (overlay) {
            overlay.remove();
            overlay = null;
        }

        showNext();

    }

    function showNext() {

        if (current || !queue.length) return;

        current = queue.shift();

        const view = current.view || {};

        overlay = el(
            "div",
            "position:fixed;inset:0;" +
            "background:rgba(0,0,0,.7);" +
            "display:flex;align-items:center;" +
            "justify-content:center;" +
            "z-index:2147483646;padding:16px;"
        );

        const card = el(
            "div",
            "width:100%;max-width:420px;" +
            "background:#12102b;color:#fff;" +
            "border:1px solid #7c5cff;" +
            "border-radius:16px;padding:22px;" +
            "box-shadow:0 12px 40px rgba(0,0,0,.6);"
        );

        card.appendChild(
            el(
                "div",
                "font-size:20px;font-weight:700;" +
                "margin-bottom:14px;",
                view.title || "Модерация"
            )
        );

        for (const row of (view.rows || [])) {

            const line = el(
                "div",
                "margin:8px 0;font-size:15px;" +
                "line-height:1.4;word-break:break-word;"
            );

            line.appendChild(
                el(
                    "span",
                    "color:#a9a3d6;",
                    String(row[0]) + ": "
                )
            );

            line.appendChild(
                el(
                    "span",
                    "font-weight:600;",
                    String(row[1])
                )
            );

            card.appendChild(line);

        }

        const button = el(
            "button",
            "margin-top:16px;width:100%;" +
            "padding:12px;border:none;" +
            "border-radius:12px;cursor:pointer;" +
            "font-size:15px;font-weight:600;" +
            "color:#fff;background:#6d4aff;",
            "Понятно"
        );

        button.onclick = close;

        card.appendChild(button);

        overlay.appendChild(card);

        document.body.appendChild(overlay);

    }

    ipcRenderer.on(
        "moderation-notice",
        (event, payload) => {

            if (
                !payload ||
                !payload.id ||
                seen.has(payload.id)
            ) {
                return;
            }

            seen.add(payload.id);

            queue.push(payload);

            showNext();

        }
    );

})();

// ======================================================
// UTF-8 -> BASE64
// ======================================================

function encodeBase64UTF8(text) {

    const bytes =
        new TextEncoder().encode(text);

    let binary = "";

    const chunkSize = 0x8000;

    for (
        let i = 0;
        i < bytes.length;
        i += chunkSize
    ) {

        const chunk =
            bytes.subarray(
                i,
                Math.min(
                    i + chunkSize,
                    bytes.length
                )
            );

        binary +=
            String.fromCharCode(
                ...chunk
            );

    }

    return btoa(binary);

}


// ======================================================
// BASE64 -> SESSION
// ======================================================

function decodeBase64UTF8(encoded) {

    const binary =
        atob(encoded);

    const bytes =
        Uint8Array.from(
            binary,
            char =>
                char.charCodeAt(0)
        );

    const decoded =
        new TextDecoder("utf-8").decode(bytes);

    return JSON.parse(decoded);

}


// ======================================================
// LOAD SESSION
// ======================================================

function loadDiscordSession() {

    try {

        const saved =
            localStorage.getItem(
                "skynix_discord_session"
            );

        if (!saved) {

            discordSession = null;

            renderInterface();

            showNotConnected();

            return;

        }

        discordSession =
            JSON.parse(saved);

        renderInterface();

        showDiscordStatus(
            discordSession
        );

        refreshDiscordRole();

    }

    catch (error) {

        console.error(
            "Discord: ошибка загрузки сессии:",
            error
        );

        discordSession = null;

        localStorage.removeItem(
            "skynix_discord_session"
        );

        renderInterface();

        showNotConnected();

    }

}

// ======================================================
// DISCORD SESSION FROM MAIN
// ======================================================

ipcRenderer.on(
    "discord-session",
    (
        event,
        encodedSession
    ) => {

        try {

            const session =
                decodeBase64UTF8(
                    encodedSession
                );

            discordSession =
                session;

            localStorage.setItem(
                "skynix_discord_session",
                JSON.stringify(session)
            );

            showDiscordStatus(
                session
            );

            renderInterface();

            refreshDiscordRole();

        }

        catch (error) {

            console.error(
                "Discord: ошибка callback:",
                error
            );

        }

    }
);


// ======================================================
// DISCORD LOGOUT FROM MAIN
// ======================================================

ipcRenderer.on(
    "discord-logout",
    () => {

        discordSession =
            null;

        localStorage.removeItem(
            "skynix_discord_session"
        );

        showNotConnected();

        renderInterface();

    }
);


// ======================================================
// REFRESH ROLE
// ======================================================

async function refreshDiscordRole() {

    if (!discordSession) {
        return;
    }

    try {

        const encodedSession =
            encodeBase64UTF8(
                JSON.stringify(
                    discordSession
                )
            );

        const response =
            await fetch(
                `${WORKER_URL}/api/discord/me`,
                {
                    method: "GET",

                    headers: {
                        "Authorization":
                            `Bearer ${encodedSession}`
                    }
                }
            );

        if (!response.ok) {
            return;
        }

        const data =
            await response.json();

        if (
            !data.success ||
            !data.session
        ) {
            return;
        }

        discordSession =
            data.session;

        localStorage.setItem(
            "skynix_discord_session",
            JSON.stringify(
                discordSession
            )
        );

        showDiscordStatus(
            discordSession
        );

        renderInterface();

    }

    catch (error) {

        console.error(
            "Discord: ошибка обновления:",
            error
        );

    }

}


// ======================================================
// DISCORD STATUS
// ======================================================

function showDiscordStatus(session) {

    const status =
        document.getElementById(
            "discordStatus"
        );

    const text =
        document.getElementById(
            "discordText"
        );

    const login =
        document.getElementById(
            "discordLogin"
        );

    status.className =
        "discord-status";

    if (
        session.status ===
        "not_member"
    ) {

        status.classList.add(
            "discord-red"
        );

        text.textContent =
            "Не участник SkyNix";

        login.style.display =
            "none";

        return;

    }

    if (
        session.status ===
        "recruit"
    ) {

        status.classList.add(
            "discord-orange"
        );

        text.textContent =
            "🔰 Новобранец SkyNix";

        login.style.display =
            "none";

        return;

    }

    status.classList.add(
        "discord-green"
    );

    if (
        session.role &&
        session.role !== ROLE_MEMBER
    ) {

        text.textContent =
            `✅ Участник SkyNix (${session.role})`;

    }

    else {

        text.textContent =
            "✅ Участник SkyNix";

    }

    login.style.display =
        "none";

}

        for (const key of Object.keys(TITLES)) {

            rows[key] = (
                data.sections[key] || []
            ).map(entry => ({
                id: entry.id || null,

                row.name = name.value;
                row.id = null;

            const count = el(
                "input",
                INPUT_CSS + "width:60px;text-align:center;"

            count.type = "number";
            count.min = "0";
            count.max = "99";

                row.count = count.value;
            };

                "input",

            );

            max.type = "number";
            max.min = "0";

                row.max = max.value;
            };

                    const index = list.indexOf(row);

                    if (index !== -1) {
                        list.splice(index, 1);

                )

                        const count = Number(row.count);

    function memberName(member) {

        return member.displayName || member.globalName || member.username || member.id;

    function renderMembers(body) {

        body.textContent = "";

        let tab = "members";

        const search = gEl("input", "g-search");

        search.placeholder = "Поиск по имени";

        body.appendChild(search);

        const tabs = gEl("div", "g-tabs");

        const tabMembers = gEl("button", "g-tab active");
        const tabRecruits = gEl("button", "g-tab");

        tabs.appendChild(tabMembers);
        tabs.appendChild(tabRecruits);

        body.appendChild(tabs);

        const grid = gEl("div", "g-grid");

        body.appendChild(grid);

        function fill() {

            const query = search.value.trim().toLowerCase();

            const matches = member =>
                !query ||
                [memberName(member), member.username, member.globalName]
                    .filter(Boolean)
                    .some(value => String(value).toLowerCase().includes(query));

            const members = [];
            const recruits = [];

            for (const member of cachedMembers) {

                if (!matches(member)) continue;

                const roles = member.roles || [];

                if (roles.includes(MEMBER_ID) || member.staffRole) members.push(member);
                else if (roles.includes(RECRUIT_ID)) recruits.push(member);

            }

            tabMembers.textContent = "Участники · " + members.length;
            tabRecruits.textContent = "Новобранцы · " + recruits.length;

            tabMembers.classList.toggle("active", tab === "members");
            tabRecruits.classList.toggle("active", tab === "recruits");

            grid.textContent = "";

            const list = tab === "members" ? members : recruits;

            if (!list.length) {

                grid.appendChild(gEl("div", "g-muted", "Никого нет."));

                return;

            }

            list.forEach((member, index) => {

                const tile = gEl("button", "g-member");

                tile.style.setProperty("--i", Math.min(index, 12));

                tile.appendChild(avatar(memberName(member), member.id, member.avatar, 40));

                const text = gEl("div", "");

                text.appendChild(gEl("div", "g-member-name", memberName(member)));

                text.appendChild(
                    gEl(
                        "div",
                        "g-member-role",
                        member.staffRole || (tab === "members" ? "Участник" : "Новобранец")
                    )
                );

                tile.appendChild(text);

                tile.onclick = () => showMember(body, member);

                grid.appendChild(tile);

            });

        }

        tabMembers.onclick = () => { tab = "members"; fill(); };
        tabRecruits.onclick = () => { tab = "recruits"; fill(); };

        search.oninput = fill;

        fill();

    }

    // ---------------- Центр уведомлений ----------------

    const NOTIF_SEEN_KEY = "skynix_notif_seen";

    function notifSeen() {
        try { return Number(localStorage.getItem(NOTIF_SEEN_KEY)) || 0; } catch { return 0; }
    }

    function markNotifSeen(ts) {
        try { localStorage.setItem(NOTIF_SEEN_KEY, String(ts)); } catch {}
        updateNotifBadge();
    }

    function fmtMs(ms) {

        const n = Number(ms);

        if (!n) return "";

        const units = [["d", 86400000], ["h", 3600000], ["m", 60000], ["s", 1000]];

        for (const [u, size] of units) {
            if (n >= size) return gDuration(Math.max(1, Math.round(n / size)) + u, true);
        }

        return gDuration("1s", true);

    }

    function sanctionTitle(action, self) {

        const names = self
            ? { mute: "Вам выдан мут", unmute: "Вам снят мут", ban: "Вам выдан бан", unban: "Вам снят бан" }
            : { mute: "Выдан мут", unmute: "Снят мут", ban: "Выдан бан", unban: "Снят бан" };

        return names[action] || action;

    }

    const REPLY_TITLES = {
        accepted: "Заявка принята",
        rejected: "Заявка отклонена",
        review: "Заявка на рассмотрении",
        info: "Информация по заявке"
    };

    let notifState = { history: [], replies: [], news: [], at: 0 };

    function showReplies() {
        return false;
    }

    function collectNotifs() {

        const out = [];

        for (const h of notifState.history || []) {
            out.push({
                kind: "sanction",
                at: Number(h.createdAt) || 0,
                title: sanctionTitle(h.action, true) + (h.action === "mute" ? fmtMs(durationToMs(h.duration)) : ""),
                tone: h.action === "ban" ? "ban" : h.action === "mute" ? "mute" : "ok",
                meta: h.moderator || "Модератор",
                text: h.reason || "Причина не указана"
            });
        }

        for (const n of notifState.news || []) {
            out.push({
                kind: "news",
                at: Number(n.at) || 0,
                title: n.platform === "telegram" ? "Новости · группа Telegram" : "Новости · группа Discord",
                tone: "ok",
                meta: n.platform === "telegram" ? n.group : "",
                text: n.text || "",
                link: n.link
            });
        }

        for (const r of showReplies() ? (notifState.replies || []) : []) {
            out.push({
                kind: "reply",
                at: Number(r.at) || 0,
                title: REPLY_TITLES[r.status] || "Информация по заявке",
                tone: r.status === "rejected" ? "ban" : r.status === "accepted" ? "ok" : "mute",
                meta: "",
                text: r.text || ""
            });
        }

        out.sort((a, b) => b.at - a.at);

        return out;

    }

    function durationToMs(raw) {

        const m = String(raw || "").match(/^(\d+)(s|m|h|d)$/i);

        if (!m) return 0;

        return Number(m[1]) * { s: 1000, m: 60000, h: 3600000, d: 86400000 }[m[2].toLowerCase()];

    }

    function updateNotifBadge() {

        const btn = document.querySelector('[data-key="notif"]');

        if (!btn) return;

        const seen = notifSeen();

        const count = collectNotifs().filter(n => n.at > seen).length;

        let badge = btn.querySelector(".g-badge");

        if (!count) {
            if (badge) badge.remove();
            return;
        }

        if (!badge) {
            badge = gEl("span", "g-badge");
            btn.appendChild(badge);
        }

        badge.textContent = count > 9 ? "9+" : String(count);

    }

    async function refreshNotifData(withReplies) {

        try {
            const profile = await ipcRenderer.invoke("profile-get");
            notifState.history = (profile && profile.history) || [];
        } catch {}

        if (withReplies && showReplies()) {
            try {
                const res = await ipcRenderer.invoke("application-replies-get");
                notifState.replies = (res && res.items) || [];
            } catch {}
        }

        if (withReplies) {
            try {
                const res = await ipcRenderer.invoke("news-get");
                notifState.news = (res && res.items) || [];
            } catch {}
        }

        notifState.at = Date.now();

        updateNotifBadge();

    }

    window.updateNotifBadge = updateNotifBadge;

    ipcRenderer.on("news-changed", (event, items) => {
        notifState.news = items || [];
        updateNotifBadge();
        if (window.__notifRepaint) window.__notifRepaint();
    });

    ipcRenderer.on("open-notifications", () => {
        if (discordSession && (discordSession.status === "member" || discordSession.status === "recruit")) {
            window.openNotifications();
        }
    });

    window.setNotifHistory = function (history) {
        notifState.history = history || [];
        updateNotifBadge();
        if (!notifState.at) {
            notifState.at = Date.now();
            refreshNotifData(true).catch(() => {});
        }
    };

    window.openNotifications = async function () {

        const body = openWindow("Центр уведомлений");

        const seenBefore = notifSeen();

        let tab = "all";

        const top = gEl("div", "g-seg");

        const list = gEl("div", "g-log");

        const tabs = [["all", "Всё"], ["news", "Новости"], ["sanction", "Наказания"]];

        if (showReplies()) tabs.push(["reply", "Заявки"]);

        function paint() {

            if (!list.isConnected) {
                window.__notifRepaint = null;
                return;
            }

            list.textContent = "";

            const items = collectNotifs().filter(n => tab === "all" || n.kind === tab);

            if (!items.length) {
                list.appendChild(gEl("div", "g-muted", tab === "reply" ? "Ответов по заявкам пока нет." : "Здесь пока пусто."));
                return;
            }

            items.forEach((n, i) => {

                const card = gEl("div", "g-notif" + (n.at > seenBefore ? " new" : ""));

                card.style.animationDelay = Math.min(i, 8) * 40 + "ms";

                const title = gEl("div", "g-notif-title");

                title.appendChild(document.createTextNode(n.title));

                if (n.at > seenBefore) title.appendChild(gEl("span", "g-new", "Новое"));

                card.appendChild(title);

                card.appendChild(gEl("div", "g-notif-meta", (n.meta ? n.meta + " · " : "") + gDate(n.at)));

                if (n.text) card.appendChild(gEl("div", "g-notif-text", n.text));

                if (n.link) {
                    const open = gEl("button", "g-notif-open", "Открыть");
                    open.onclick = () => openExternal(n.link);
                    card.appendChild(open);
                }

                list.appendChild(card);

            });

        }

        tabs.forEach(([id, label]) => {
            const b = gEl("button", id === tab ? "on" : "", label);
            b.onclick = () => {
                tab = id;
                top.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
                paint();
            };
            top.appendChild(b);
        });

        body.appendChild(top);

        body.appendChild(gEl("div", "g-count", ""));

        body.appendChild(list);

        list.appendChild(gEl("div", "g-muted", "Загрузка..."));

        window.__notifRepaint = paint;

        await refreshNotifData(true);

        paint();

        const newest = collectNotifs()[0];

        if (newest) markNotifSeen(Math.max(newest.at, notifSeen()));

    };

    // ---------------- Журнал модераторов ----------------

    window.openModLog = async function () {

        if (!(discordSession && discordSession.status === "member" && hasStaffRole())) return;

        const body = openWindow("Журнал модераторов", true);

        const wrap = gEl("div", "");

        try {
            data = await ipcRenderer.invoke("modlog-get");

            });

        [selAction, selPlatform, selMod, selPeriod].forEach(n => n.onchange = paint);

        search.oninput = paint;

        paint();

function gEl(tag, className, text) {

    const node = document.createElement(tag);

function gGreeting() {

    const hour = new Date().getHours();

    if (hour < 5) return "Доброй ночи";
    if (hour < 12) return "Доброе утро";
    if (hour < 18) return "Добрый день";

    return "Добрый вечер";

}

function animateNumber(node, to, suffix) {

    const start = performance.now();

    function tick(now) {

        const p = Math.min(1, (now - start) / 700);

        node.textContent =
            Math.round(to * (1 - Math.pow(1 - p, 3))) + suffix;

        if (p < 1) requestAnimationFrame(tick);

    }

    requestAnimationFrame(tick);

}

function gDuration(raw, forceRu) {

    const match = String(raw || "").match(/^(\d+)(s|m|h|d)$/i);

    if (!match) return "";

    const n = Number(match[1]);

    const forms = {
        s: ["секунда", "секунды", "секунд"],
        m: ["минута", "минуты", "минут"],
        h: ["час", "часа", "часов"],
        d: ["день", "дня", "дней"]
    }[match[2].toLowerCase()];

    const n10 = n % 10;
    const n100 = n % 100;

    const word =
        n10 === 1 && n100 !== 11
            ? forms[0]
            : (n10 >= 2 && n10 <= 4 && (n100 < 12 || n100 > 14))
                ? forms[1]
                : forms[2];

    if (!forceRu && window.SkyI18n && window.SkyI18n.lang === "en") {
        return " for " + n + " " + (n === 1 ? { s: "second", m: "minute", h: "hour", d: "day" }[match[2].toLowerCase()] : { s: "seconds", m: "minutes", h: "hours", d: "days" }[match[2].toLowerCase()]);
    }

    return " на " + n + " " + word;

}

function gDate(timestamp) {

    const d = new Date(Number(timestamp));

    const two = v => String(v).padStart(2, "0");

    if (window.SkyI18n && window.SkyI18n.lang === "en") {
        return two(d.getMonth() + 1) + "/" + two(d.getDate()) + " " + d.getHours() + ":" + two(d.getMinutes());
    }

    return two(d.getDate()) + "." + two(d.getMonth() + 1) + " " + d.getHours() + ":" + two(d.getMinutes());

}

function ensureShell() {

    if (document.getElementById("sidebar")) return;

    const orbs = gEl("div", "g-orbs");

    orbs.innerHTML = "<i></i><i></i><i></i>";

    document.body.insertBefore(orbs, document.body.firstChild);

    const aside = gEl("aside");

    aside.id = "sidebar";

    aside.appendChild(gEl("div", "g-brand", "SkyNix"));

    const nav = gEl("nav");

    nav.id = "nav";

    nav.style.display = "contents";

    aside.appendChild(nav);

    document.body.insertBefore(aside, orbs.nextSibling);

    // Окна, созданные скриптами (профиль, предупреждения и т.д.), получают стекло и анимацию
    new MutationObserver(list => {

        for (const record of list) {

            for (const node of record.addedNodes) {

                if (
                    node.nodeType === 1 &&
                    node.style &&
                    node.style.position === "fixed" &&
                    node.style.pointerEvents !== "none" &&
                    parseInt(node.style.zIndex, 10) >= 2147483640 &&
                    !node.classList.contains("g-overlay")
                ) {

                    node.classList.add("g-overlay");

                    if (node.firstElementChild) {
                        node.firstElementChild.classList.add("g-modal");
                    }

                }

            }

        }

    }).observe(document.body, { childList: true });

}

async function loadMinecraftStatusCard(card, token) {

    const body = gEl("div", "");

    card.appendChild(body);

    body.appendChild(gEl("div", "g-muted", "Проверяем сервер..."));

    let lastSig = "";
    let pingNode = null;

    async function refresh() {

        if (token !== dashboardToken || !document.body.contains(card)) {
            clearInterval(minecraftStatusTimer);
            return;
        }

        let status;

        try {
            status = await ipcRenderer.invoke("minecraft-status");
        } catch {
            status = { online: false, error: "ошибка" };
        }

        if (token !== dashboardToken) return;

        const online = Boolean(status && status.online);

        const pingText = online
            ? "Пинг " + status.ping + " мс" + (status.version ? " · " + status.version : "")
            : "";

        const sig = JSON.stringify(
            online
                ? [true, status.players, status.version]
                : [false, status && status.error]
        );

        // Ничего не изменилось — не перерисовываем, чтобы не мигало
        if (sig === lastSig) {
            if (pingNode) pingNode.textContent = pingText;
            return;
        }

        lastSig = sig;

        body.textContent = "";

        card.classList.add("g-silent");

        const head = gEl("div", "g-mc-head");
        head.appendChild(gEl("i", "g-mc-dot " + (online ? "on" : "off")));
        head.appendChild(gEl("b", "", online ? "Онлайн" : "Офлайн"));
        body.appendChild(head);

        pingNode = null;

        if (online) {

            body.appendChild(gEl("div", "g-mc-count", status.players.online + " / " + status.players.max + " игроков"));

            if (status.players.sample && status.players.sample.length) {
                body.appendChild(gEl("div", "g-muted", status.players.sample.join(", ")));
            }

            pingNode = gEl("div", "g-muted small", pingText);
            body.appendChild(pingNode);

        } else {

            body.appendChild(gEl("div", "g-muted", "Сервер сейчас не отвечает. Возможно, он выключен или запускается."));

            const why = (MC_REASONS[status && status.error] || (status && status.error) || "") +
                (status && status.tried ? " · " + status.tried.join(", ") : "");

            if (why.trim()) body.appendChild(gEl("div", "g-mc-why", "Причина: " + why));

        }
    }

    refresh();

    clearInterval(minecraftStatusTimer);
    minecraftStatusTimer = setInterval(refresh, 30000);
}

async function loadWarningsCard(card, token, silent) {

    let body = card._body;

    if (!body) {

        body = gEl("div", "");

        card._body = body;

        card.appendChild(body);

        body.appendChild(gEl("div", "g-muted", "Загрузка..."));

        silent = false;

    }

    try {

        const data = await ipcRenderer.invoke("profile-telegram-status");

        if (token !== dashboardToken) return;

        const sig = JSON.stringify([data.linked, data.warnings]);

        if (silent && card._sig === sig) return;

        card._sig = sig;

        if (silent) card.classList.add("g-silent");

        body.textContent = "";

        if (!data.linked) {

            body.appendChild(
                gEl(
                    "p",
                    "g-text",
                    "Привяжите Telegram в профиле, чтобы видеть свои предупреждения здесь."
                )
            );

            body.appendChild(gButton("Привязать Telegram", () => openProfile(), "primary"));

            return;

        }

        const warnings = data.warnings;

        if (!warnings) {

            body.appendChild(gEl("div", "g-muted", "Данные о предупреждениях пока не загружены."));

            return;

        }

        if (!warnings.items || !warnings.items.length) {

            body.appendChild(gEl("div", "g-muted", "Вас нет в списках предупреждений."));

            return;

        }

        for (const item of warnings.items) {

            const row = gEl("div", "g-row");

            row.appendChild(gEl("span", "", item.title));

            const value = gEl("b", "", "0 из " + item.max);

            row.appendChild(value);

            animateNumber(value, item.count, " из " + item.max);

            const percent = item.max > 0
                ? Math.min(100, Math.round(item.count / item.max * 100))
                : 0;

            const bar = gEl("div", "g-bar");

            const fill = document.createElement("i");

            fill.style.setProperty("--w", Math.max(percent, 4) + "%");

            if (percent >= 100) fill.className = "danger";
            else if (percent >= 60) fill.className = "warn";

            bar.appendChild(fill);

            body.appendChild(row);
            body.appendChild(bar);

        }

    }

    catch (error) {

        if (token !== dashboardToken) return;

        if (silent) return;

        body.textContent = "";

        body.appendChild(gEl("div", "g-muted", "Не удалось загрузить предупреждения."));

    }

}

function renderInterface(force) {

    ensureShell();

    // Перерисовываем только при смене аккаунта или роли —
    // иначе значки и карточки «моргали» при каждом обновлении
    const stateKey = JSON.stringify(
        discordSession
            ? [
                discordSession.userId,
                discordSession.status,
                discordSession.role,
                discordSession.globalName,
                discordSession.username
            ]
            : null
    );

    const navNode = document.getElementById("nav");

    if (
        !force &&
        stateKey === lastRenderKey &&
        navNode &&
        navNode.children.length
    ) {
        return;
    }

    lastRenderKey = stateKey;

    const token = ++dashboardToken;

    dashboardCards.warnings = null;
    dashboardCards.history = null;

    const root = document.getElementById("actions");

    root.textContent = "";

    const status = discordSession ? discordSession.status : null;

    const team = status === "member" || status === "recruit";

    const staff = status === "member" && hasStaffRole();

    const ban = staff && hasBanPermission();

    const canWarn = staff && Boolean(window.canEditWarnings && window.canEditWarnings());

    const canMembers = staff && Boolean(window.canViewMembers && window.canViewMembers());

    const name =
        discordSession
            ? (discordSession.globalName || discordSession.username || "")
            : "";

    // ---- меню слева ----
    const nav = [
        { label: "Главная", icon: "home", active: true, action: scrollToTop }
    ];

    if (discordSession) {
        nav.push({ label: "Профиль", icon: "user", action: () => openProfile() });
    }

    if (canMembers) {
        nav.push({ label: "Участники", icon: "users", action: () => openMembersProfiles() });
    }

    if (staff) {
        nav.push({ label: "Модерация", icon: "shield", action: () => openModerationHub() });
    }

    nav.push({ label: "Wiki", icon: "book", action: () => openWiki() });

    if (discordSession && (discordSession.status === "member" || discordSession.status === "recruit")) {

// ======================================================
// LOAD DISCORD USERS
// ======================================================

async function loadModerationUsers() {

    const select =
        document.getElementById(
            "moderationUser"
        );

    select.disabled =
        true;

    select.innerHTML =
        `
        <option value="">
            Загрузка пользователей...
        </option>
        `;

    try {

        if (!discordSession) {

            throw new Error(
                "Discord не авторизован."
            );

        }

        const encodedSession =
            encodeBase64UTF8(
                JSON.stringify(
                    discordSession
                )
            );

        let type =
            "members";

        if (
            moderationAction === "unmute"
        ) {

            type =
                "muted";

        }

        if (
            moderationAction === "unban"
        ) {

            type =
                "banned";

        }

        const response =
            await fetch(
                `${WORKER_URL}/api/discord/moderation/users?type=${type}`,
                {
                    method: "GET",

                    headers: {
                        "Authorization":
                            `Bearer ${encodedSession}`
                    }
                }
            );

        const data =
            await response.json();

        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.error ||
                "Не удалось получить список пользователей."
            );

        }

        moderationUsers =
            Array.isArray(
                data.users
            )
                ? data.users
                : [];

        select.innerHTML =
            "";

        const noneOption =
            document.createElement(
                "option"
            );

        noneOption.value =
            "";

        noneOption.textContent =
            "Нет";

        select.appendChild(
            noneOption
        );

        moderationUsers
            .sort(
                (a, b) =>
                    (
                        a.displayName ||
                        a.username ||
                        ""
                    ).localeCompare(
                        b.displayName ||
                        b.username ||
                        "",
                        "ru"
                    )
            )
            .forEach(
                user => {

                    const option =
                        document.createElement(
                            "option"
                        );

                    option.value =
                        String(
                            user.id
                        );

                    option.textContent =
                        user.displayName
                            ? (
                                user.username
                                    ? `${user.displayName} (@${user.username})`
                                    : user.displayName
                              )
                            : (
                                user.username
                                    ? `@${user.username}`
                                    : String(user.id)
                              );

                    select.appendChild(
                        option
                    );

                }
            );

    }

    catch (error) {

        console.error(
            "Ошибка списка Discord:",
            error
        );

        select.innerHTML =
            `
            <option value="">
                Нет
            </option>
            `;

        showModerationError(
            error.message ||
            "Не удалось получить пользователей Discord."
        );

    }

    finally {

        select.disabled =
            false;

    }

}


// ======================================================
// LOAD TELEGRAM USERS
// ======================================================

async function loadTelegramUsers() {

    const select =
        document.getElementById(
            "telegramUser"
        );

    if (!select) {

        console.error(
            "Telegram: элемент telegramUser не найден."
        );

        return;

    }

    select.disabled =
        true;

    select.innerHTML =
        `
        <option value="">
            Загрузка пользователей...
        </option>
        `;

    telegramUsers = [];

    try {

        /*
         * ВАЖНО:
         *
         * Используем ipcRenderer напрямую.
         *
         * window.electronAPI у тебя НЕ существует,
         * поэтому старый вызов давал ошибку.
         */

        const members =
            await ipcRenderer.invoke(
                (moderationAction === "unban" ? "telegram-get-banned" : "telegram-get-members")
            );

        console.log(
            "Telegram /api/members:",
            members
        );

        if (!Array.isArray(members)) {

            throw new Error(
                "Telegram: Worker вернул некорректный список пользователей."
            );

        }

        telegramUsers =
            members.filter(
                user =>
                    user &&
                    user.id !== null &&
                    user.id !== undefined
            );

        select.innerHTML =
            "";

        const noneOption =
            document.createElement(
                "option"
            );

        noneOption.value =
            "";

        noneOption.textContent =
            "Нет";

        select.appendChild(
            noneOption
        );

        for (
            const user of telegramUsers
        ) {

            const option =
                document.createElement(
                    "option"
                );

            /*
             * Здесь должен быть НАСТОЯЩИЙ
             * Telegram numeric ID.
             */

            option.value =
                String(
                    user.id
                );

            let displayName = "";

            if (user.username) {

                displayName =
                    "@" +
                    String(
                        user.username
                    );

            }
            else {

                displayName =
                    [
                        user.first_name,
                        user.last_name
                    ]
                        .filter(Boolean)
                        .join(" ");

            }

            if (!displayName) {

                displayName =
                    String(
                        user.id
                    );

            }

            option.textContent =
                displayName +
                (
                    window.telegramGroupSuffix
                        ? window.telegramGroupSuffix(user, moderationAction === "unban")
                        : ""
                );

            select.appendChild(
                option
            );

        }

        /*
         * Даже если список пустой,
         * это не ошибка.
         */

        // Ручной ввод для разбана: @username или числовой ID
        const oldManual = document.getElementById("telegramManual");

        if (oldManual) oldManual.remove();

        if (moderationAction === "unban") {

            const manual = document.createElement("input");

            manual.id = "telegramManual";
            manual.type = "text";
            manual.placeholder = "Нет в списке? Введите @username или ID";
            manual.style.marginTop = "8px";

            select.parentNode.insertBefore(manual, select.nextSibling);

        }

        console.log(
            "Telegram пользователи загружены:",
            telegramUsers.length
        );

    }

    catch (error) {

        console.error(
            "Ошибка загрузки Telegram пользователей:",
            error
        );

        telegramUsers = [];

        select.innerHTML =
            `
            <option value="">
                Нет
            </option>
            `;

        showModerationError(
            "Telegram: " +
            (
                error?.message ||
                "не удалось загрузить пользователей."
            )
        );

    }

    finally {

        select.disabled =
            false;

    }

}


// ======================================================
// MUTE DURATION
// ======================================================

function getMuteDuration() {

    const amountInput =
        document.getElementById(
            "muteAmount"
        );

    const unitInput =
        document.getElementById(
            "muteUnit"
        );

    if (!amountInput) {

        throw new Error(
            "Поле времени мута не найдено."
        );

    }

    const amount =
        Number(
            amountInput.value
        );

    if (
        !Number.isFinite(amount) ||
        amount <= 0
    ) {

        throw new Error(
            "Укажите конкретное время мута."
        );

    }

    const rawUnit =
        unitInput
            ? String(
                unitInput.value || ""
              )
                .trim()
                .toLowerCase()
            : "";

    const multipliers = {

        s:
            1000,

        m:
            60 *
            1000,

        h:
            60 *
            60 *
            1000,

        d:
            24 *
            60 *
            60 *
            1000

    };

    const multiplier =
        multipliers[
            rawUnit
        ];

    if (!multiplier) {

        throw new Error(
            "Неизвестная единица времени: " +
            rawUnit
        );

    }

    const duration =
        amount *
        multiplier;

    const maxDuration =
        28 *
        24 *
        60 *
        60 *
        1000;

    if (
        duration >
        maxDuration
    ) {

        throw new Error(
            "Максимальное время мута — 28 дней."
        );

    }

    return duration;

}

// ======================================================
// CONFIRM MODERATION
// ======================================================

async function confirmModeration() {

    hideModerationError();

    try {

        const discordSelect =
            document.getElementById(
                "moderationUser"
            );

        const telegramSelect =
            document.getElementById(
                "telegramUser"
            );

        const discordId =
            discordSelect &&
            discordSelect.value &&
            discordSelect.value !== "Нет"
                ? String(
                    discordSelect.value
                  ).trim()
                : "";

        let telegramId =
            telegramSelect &&
            telegramSelect.value &&
            telegramSelect.value !== "Нет"
                ? String(telegramSelect.value).trim()
                : "";

        const manualInput = document.getElementById("telegramManual");

        if (!telegramId && manualInput && manualInput.value.trim()) {

            const typed = manualInput.value.trim();

            if (/^\d+$/.test(typed)) {

                telegramId = typed;

            }
            else {

                try {

                    telegramId = String(
                        await ipcRenderer.invoke("telegram-resolve", typed)
                    );

                }
                catch (error) {

                    throw new Error(
                        "Telegram: " +
                        String((error && error.message) || error)
                            .replace(/^Error invoking remote method '[^']*':\s*(Error:\s*)?/, "")
                    );

                }

            }

        }

        if (
            !discordId &&
            !telegramId
        ) {
            throw new Error(
                "Выберите пользователя Discord или Telegram."
            );
        }


        // ==============================================
        // ПРИЧИНА
        // ==============================================

        let reason = "";

        if (
            moderationAction ===
            "mute"
        ) {

            const input =
                document.getElementById(
                    "muteReason"
                );

            reason =
                input
                    ? String(
                        input.value || ""
                      ).trim()
                    : "";

        } else {

            const input =
                document.getElementById(
                    "actionReason"
                );

            reason =
                input
                    ? String(
                        input.value || ""
                      ).trim()
                    : "";

        }


        if (!reason) {

            throw new Error(
                "Укажите причину."
            );

        }


        // ==============================================
        // ВРЕМЯ МУТА
        // ==============================================

        let duration = null;

        if (
            moderationAction ===
            "mute"
        ) {

            duration =
                getMuteDuration();

            console.log(
                "Время мута:",
                duration,
                "мс"
            );

        }


        // ==============================================
        // ПОЛНЫЕ ДАННЫЕ
        // ==============================================

        const actionData = {

            action:
                moderationAction,

            discordUserId:
                discordId || null,

            telegramUserId:
                telegramId || null,

            duration:
                duration,

            reason:
                reason

        };


        console.log(
            "Модерация:",
            actionData
        );


        const confirmButton =
            document.getElementById(
                "moderationConfirm"
            );

        confirmButton.disabled =
            true;

        confirmButton.textContent =
            "Выполнение...";


        await sendModerationAction(
            actionData
        );


        window.alert(
            "Действие успешно выполнено."
        );


        closeModerationModal();

    }

    catch (error) {

        console.error(
            "Ошибка модерации:",
            error
        );

        showModerationError(
            error?.message ||
            String(error)
        );

    }

    finally {

        const button =
            document.getElementById(
                "moderationConfirm"
            );

        if (button) {

            button.disabled =
                false;

            updateModerationModal();

        }

    }

}


// ======================================================
// SEND MODERATION ACTION
// ======================================================

async function sendModerationAction(
    actionData
) {

    if (!actionData) {

        throw new Error(
            "Данные модерации отсутствуют."
        );

    }


    const action =
        String(
            actionData.action || ""
        ).trim();


    const discordUserId =
        actionData.discordUserId
            ? String(
                actionData.discordUserId
              ).trim()
            : "";


    const telegramUserId =
        actionData.telegramUserId
            ? String(
                actionData.telegramUserId
              ).trim()
            : "";


    const duration =
        actionData.duration;


    const reason =
        actionData.reason || "";


    if (
        !discordUserId &&
        !telegramUserId
    ) {

        throw new Error(
            "Не выбран пользователь."
        );

    }


    // ==================================================
    // DISCORD
    // ==================================================

    if (discordUserId) {

        try {

            await ipcRenderer.invoke(
                "discord-moderation",
                {
                    action:
                        action,

                    userId:
                        discordUserId,

                    duration:
                        duration,

                    reason:
                        reason
                }
            );

        }

        catch (error) {

            throw new Error(
                "Discord: " +
                (
                    error?.message ||
                    String(error)
                )
            );

        }

    }


    // ==================================================
    // TELEGRAM
    // ==================================================

    if (telegramUserId) {

        const numericTelegramId =
            Number(
                telegramUserId
            );


        if (
            !Number.isFinite(
                numericTelegramId
            )
        ) {

            throw new Error(
                "Некорректный Telegram ID."
            );

        }


        const payload = {

            action:
                action,

            telegram_user_id:
                numericTelegramId,

            reason:
                reason,

            moderator:
                discordSession?.username ||
                discordSession?.globalName ||
                "SkyNix"

        };


        // ==============================================
        // TELEGRAM MUTE
        // ==============================================

        if (
            action ===
            "mute"
        ) {

            const durationMs =
                Number(
                    duration
                );


            console.log(
                "Telegram duration:",
                durationMs
            );


            if (
                !Number.isFinite(
                    durationMs
                ) ||
                durationMs <= 0
            ) {

                throw new Error(
                    "Некорректное время мута."
                );

            }


            const maxDuration =
                28 *
                24 *
                60 *
                60 *
                1000;


            if (
                durationMs >
                maxDuration
            ) {

                throw new Error(
                    "Максимальное время мута — 28 дней."
                );

            }


            payload.duration_ms =
                durationMs;

        }


        console.log(
            "Telegram moderation:",
            payload
        );


        try {

            await ipcRenderer.invoke(
                "telegram-moderation",
                payload
            );

        }

        catch (error) {

            throw new Error(
                "Telegram: " +
                (
                    error?.message ||
                    String(error)
                )
            );

        }

    }


    return {
        ok: true
    };

}


// ======================================================
// MODAL ERROR
// ======================================================

function showModerationError(
    message
) {

    const error =
        document.getElementById(
            "moderationError"
        );

    error.textContent =
        message;

    error.classList.add(
        "visible"
    );

}


function hideModerationError() {

    const error =
        document.getElementById(
            "moderationError"
        );

    error.textContent =
        "";

    error.classList.remove(
        "visible"
    );

}


// ======================================================
// CLOSE MODAL ON BACKGROUND CLICK
// ======================================================

document.getElementById(
    "moderationOverlay"
).addEventListener(
    "click",
    event => {

        if (
            event.target ===
            event.currentTarget
        ) {

            closeModerationModal();

        }

    }
);


// ======================================================
// START
// ======================================================

loadDiscordSession();


// ======================================================
// CHECK ROLE EVERY 10 SECONDS
// ======================================================

setInterval(
    refreshDiscordRole,
    10000
);

</script>
